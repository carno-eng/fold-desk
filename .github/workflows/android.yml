name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          {
            echo "== env"; echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"; java -version 2>&1
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | tr '\n' ' '; echo
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "== gradle"
            curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" --no-daemon --console=plain assembleRelease
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Widget previews
        if: success()
        continue-on-error: true
        working-directory: android
        run: |
          "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" --no-daemon --console=plain testDebugUnitTest --tests '*WidgetShots*' > "$RUNNER_TEMP/shots.log" 2>&1 || true
          tail -c 60000 "$RUNNER_TEMP/shots.log" > "$RUNNER_TEMP/shots-tail.log"
          ls app/build/shots >> "$RUNNER_TEMP/shots-tail.log" 2>&1 || true

      - name: Publish build log
        if: always()
        run: |
          tail -c 150000 "$RUNNER_TEMP/build.log" > /tmp/android-build.log 2>/dev/null || echo "no log" > /tmp/android-build.log
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }} signed=${{ env.KEYSTORE_FILE != '' }}" > /tmp/status.txt
          cd "$RUNNER_TEMP" && rm -rf logs && mkdir logs && cd logs
          git init -q && git checkout -q -b ci-logs
          cp /tmp/android-build.log /tmp/status.txt .
          cp "$RUNNER_TEMP/shots-tail.log" . 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/android/app/build/shots" ]; then mkdir shots && cp "$GITHUB_WORKSPACE"/android/app/build/shots/*.png shots/ 2>/dev/null || true; fi
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Fold Desk Android 1.0.${{ github.run_number }}
          body: "スマホでこのページを開き、下の app-release.apk をダウンロードしてインストールしてください。"
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
