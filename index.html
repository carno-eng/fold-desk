function parseCSV(text){
  text = String(text || "").replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const first = text.split("\n").find(l => l.trim()) || "";
  const dl = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch === '"' && cell === "") q = true;
    else if(ch === dl){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(c => String(c).trim())).filter(r => r.some(Boolean));
}

const API = { get url(){ return ls.get("fd-api", ""); }, get token(){ return ls.get("fd-token", ""); } };
const paired = () => /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(API.url) && API.token.length >= 40;
let syncState = "idle";
function setSync(s){ if(syncState !== s){ syncState = s; S.local = s !== "ok"; schedule(); } }
async function call(body, timeoutMs = 30000){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeoutMs);
  let r;
  try { r = await fetch(API.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...body, token:API.token}), redirect:"follow", cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer", signal:ctl.signal}); }

  if(!j.ok){ const x = new Error(j.error || j.code || "error"); x.code = j.code || "server"; if(x.code === "auth" || x.code === "locked") setSync(x.code); throw x; }

const store = (() => {
  const KEY = "fd-store-v1", QKEY = "fd-queue-v1";
  let st = ls.get(KEY, {cols:{}, cfg:{}, rev:0}), queue = ls.get(QKEY, []), flushing = false, pulling = false;
  const subs = {};
  const snapOf = c => ({docs:Object.entries(st.cols[c] || {}).map(([id, d]) => ({id, data:() => d}))});
  const cfgSnap = k => ({exists:st.cfg[k] !== undefined && st.cfg[k] !== null, data:() => st.cfg[k]});
  const emitCol = c => (subs["c:" + c] || []).forEach(fn => fn(snapOf(c)));
  const emitCfg = k => (subs["d:" + k] || []).forEach(fn => fn(cfgSnap(k)));
  const emitAll = () => { Object.keys(subs).forEach(k => k[0] === "c" ? emitCol(k.slice(2)) : emitCfg(k.slice(2))); };
  function apply(op){
    if(op.op === "put"){ (st.cols[op.col] = st.cols[op.col] || {})[op.id] = op.doc; }
    else if(op.op === "del"){ if(st.cols[op.col]) delete st.cols[op.col][op.id]; }
    else if(op.op === "cfg"){ st.cfg[op.key] = op.value; }
  }
  const persist = () => { ls.set(KEY, st); ls.set(QKEY, queue); };
  function local(op){ apply(op); queue.push(op); persist(); op.op === "cfg" ? emitCfg(op.key) : emitCol(op.col); flush(); }
  async function flush(){
    if(flushing || !queue.length || !paired()) return;
    flushing = true;
    try {
      while(queue.length){ const batch = queue.slice(0, 40); const j = await call({op:"batch", ops:batch}); queue.splice(0, batch.length); st.rev = j.rev; persist(); }
      setSync("ok");
    } catch(e){ if(e.code !== "auth" && e.code !== "locked") setSync("offline"); setTimeout(flush, 20000); }
    finally { flushing = false; }
  }
  async function pull(force){
    if(pulling || !paired()) return; pulling = true;
    try {
      if(queue.length) await flush();
      const j = await call({op: force === "sync" ? "sync" : "pull", rev: force ? 0 : st.rev});
      if(j.changed){ st.cols = j.data.cols || {}; st.cfg = j.data.cfg || {}; st.rev = j.rev; queue.forEach(apply); persist(); emitAll(); }
      setSync("ok");
    } catch(e){ if(e.code !== "auth" && e.code !== "locked") setSync("offline"); }
    finally { pulling = false; }
  }
  function wipe(){ st = {cols:{}, cfg:{}, rev:0}; queue = []; persist(); emitAll(); }

  function reload(){ const a = ls.get(KEY, null); if(!a) return; st = a; queue = ls.get(QKEY, []); emitAll(); flush(); }
  return {
    collection(c){ return { doc(id){ return { set: async body => local({op:"put", col:c, id, doc:body}), delete: async () => local({op:"del", col:c, id}) }; },
      onSnapshot(fn){ (subs["c:" + c] = subs["c:" + c] || []).push(fn); fn(snapOf(c)); } }; },
    doc(path){ const k = path.split("/")[1]; return { set: async v => local({op:"cfg", key:k, value:v}), onSnapshot(fn){ (subs["d:" + k] = subs["d:" + k] || []).push(fn); fn(cfgSnap(k)); } }; },
    pull, flush, wipe, reload, get pending(){ return queue.length; },
    async idle(){ for(let i = 0; i < 150 && pulling; i++) await new Promise(r => setTimeout(r, 200)); }
  };
})();

const SCHOOL_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[A-Za-z0-9.-]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec$/;

/* events with the same name on the same day (personal calendar, school calendar, from mail, typed in the app) are shown once.
   Nothing is deleted or copied: the hidden ones are listed in evDups under the one that is shown. */
let evDups = {};
const evKey = t => String(t || "").normalize("NFKC").toLowerCase().replace(/【[^】]*】|\[[^\]]*\]/g, "").replace(/[\s・･、。,.\-ー―〜~()（）\[\]【】「」『』:：]/g, "");
function mergeEvents(){
  const all = personalEvents.concat(schoolEvents(), devEv);
  evDups = {};
  if(S.prefs && S.prefs.mergeEvents === false){ S.events = all; return; }
  const rank = e => (e.school ? 0 : e.calId ? 30 : 20) + (e.time ? 2 : 0) + (e.place ? 1 : 0);
  const groups = new Map(), out = [];
  for(const e of all){
    const k = evKey(e.title); if(!k || !e.date){ out.push(e); continue; }
    const key = e.date + "|" + k, g = groups.get(key) || [];
    const hit = g.find(x => !x.time || !e.time || x.time === e.time);
    if(hit){ hit.m.push(e); if(!hit.time) hit.time = e.time; } else { g.push({time:e.time, m:[e]}); groups.set(key, g); }
  }
  groups.forEach(g => g.forEach(n => { n.m.sort((a, b) => rank(b) - rank(a)); out.push(n.m[0]); if(n.m.length > 1) evDups[n.m[0].id] = n.m.slice(1); }));
  S.events = out;
}

        <form data-form="pair" style="margin-top:10px"><div class="field"><label for="pu">ウェブアプリの URL</label><input id="pu" name="u" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
        <div class="field"><label for="pt">合言葉</label><input id="pt" name="t" type="password" autocomplete="off"></div>
        <div class="btns"><button class="btn primary" type="submit">接続</button></div></form></details>
    </div></div>`;
}

/* installability & system notifications */
let installEvt = null, swReg = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; schedule(); });
addEventListener("appinstalled", () => { installEvt = null; toast("ホーム画面に追加しました"); schedule(); });
const standalone = () => matchMedia("(display-mode: standalone)").matches;
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {});
function sysNotify(r){
  if(NATIVE) return;
  try {
    if(document.hidden && swReg && "Notification" in window && Notification.permission === "granted")
      swReg.showNotification(r.title, {body:[r.lead, r.body].filter(Boolean).join(" ・ "), icon:"icons/icon-192.png", badge:"icons/badge-96.png", tag:r.key || r.title, data:{go:r.go || "today"}});
  } catch(e){}
}

/* ================= boot ================= */
readPairing();
readHash(); setMode();
db = store; sample = aiShim; sampleImages = true; mcp = calShim; S.local = true;
COLS.forEach(c => db.collection(c).onSnapshot(snap => { const docs = snap.docs.map(x => ({...x.data(), id:x.id})); if(c === "events"){ personalEvents = docs; mergeEvents(); } else S[c] = docs; schedule(); }));
db.doc("config/timetable").onSnapshot(s => { S.tt = s.exists ? s.data() : null; schedule(); });
db.doc("config/days").onSnapshot(s => { S.days = s.exists ? s.data() : {}; schedule(); });
db.doc("config/prefs").onSnapshot(s => { S.prefs = s.exists ? s.data() : {}; mergeEvents(); schedule(); });
db.doc("config/school").onSnapshot(s => { applySchool(s.exists ? s.data() : null); schedule(); });
db.doc("config/google").onSnapshot(s => { S.google = s.exists ? s.data() : {}; });
S.ready = true; schedule();
refreshSchool(schoolJustPaired);
refreshDevice();
setInterval(() => { if(!document.hidden) refreshDevice(); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshDevice(); });
setInterval(() => { if(!document.hidden) refreshSchool(); }, 5 * 60e3);
if(schoolJustPaired) setTimeout(() => toast("学校のアカウントを接続しました"), 600);
if(schoolPairError) setTimeout(() => toast("学校の接続リンクを読み取れませんでした"), 600);
if(paired()){
  store.pull().then(() => { setTimeout(remindCheck, 1200); loadConciergeArt(); });
  setInterval(() => { if(!document.hidden) store.pull(); }, 45000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden){ store.reload(); store.pull(); refreshSchool(); } });
  window.__fdResume = () => { store.reload(); store.pull(); refreshSchool(); refreshDevice(); };
  addEventListener("online", () => store.pull());
}
if(["#ask","#prep","#settings","#follow"].includes(location.hash)) setTimeout(() => openRoute(location.hash), 500);
async function widgetAct(a){
  if(a.a === "task"){ const t = S.tasks.find(x => x.id === a.id); if(t && t.status !== "done"){ if(t.gcalId) await gcalDelete(t.gcalId); await put("tasks", t.id, {...t, status:"done", gcalId:""}); } }
  else if(a.a === "follow"){ const f = S.followups.find(x => x.id === a.id); if(f && f.status !== "done") await put("followups", f.id, {...f, status:"done"}); }
  else if(a.a === "prep"){ const [pid, i] = String(a.key || "").split(":"), p = S.progress.find(x => x.id === pid);
    if(p && !(p.prepDone || []).includes(+i)) await put("progress", pid, {...p, prepDone:[...(p.prepDone || []), +i]}); }
  else if(a.a === "mode" && DAY_MODES.includes(a.mode) && /^\d{4}-\d{2}-\d{2}$/.test(a.date || "")){ if(dayMode(a.date) !== a.mode) await setDayMode(a.mode, a.date); }
}
if(NATIVE && location.hash === "#act"){
  (async () => {
    try { if(paired()){ await store.idle(); await store.pull(); await store.idle(); } } catch(e){}
    let acts = []; try { acts = JSON.parse(NATIVE.takeActions() || "[]"); } catch(e){}
    for(const a of acts){ try { await widgetAct(a); } catch(e){} }
    const t0 = Date.now(); store.flush();
    while(store.pending && paired() && Date.now() - t0 < 25000) await new Promise(r => setTimeout(r, 400));
    pushSnapshot(true); try { NATIVE.done(); } catch(e){}
  })();
}
if(NATIVE && location.hash === "#snapshot"){
  const finish = () => { pushSnapshot(true); try { NATIVE.done(); } catch(e){} };
  if(paired()) store.pull().then(finish, finish); else finish();
}
document.addEventListener("visibilitychange", () => { if(document.hidden) pushSnapshot(true); });
function openRoute(h){
  if(h === "#ask") askPane();
  else if(h === "#prep"){ go("today"); setTimeout(() => prepPane(prepTarget()), 300); }
  else if(h === "#settings"){ go("today"); setTimeout(() => settingsPane(), 300); }
  else if(h === "#follow"){ go("tasks"); }
}
addEventListener("hashchange", () => {
  if(location.hash.indexOf("#school=") === 0){ readPairing(); if(schoolJustPaired){ schoolJustPaired = false; toast("学校のアカウントを接続しました"); refreshSchool(true); } schoolHandoffPane(); return; }
  if(location.hash.indexOf("#pair=") === 0 && readPairing()) location.reload(); openRoute(location.hash); });
/* the link mailed by the school script opens in the browser; hand it to the Android app, which keeps its own storage */
function schoolHandoffPane(){
  if(NATIVE || !isAndroid || !schoolHandoff) return;
  const link = `intent://pair?s=${schoolHandoff}#Intent;scheme=folddesk;package=io.github.carnoeng.folddesk;end`; schoolHandoff = "";
  openPane(`${paneHead("学校のアカウント")}<p class="empty" style="margin-top:0">Android アプリの Fold Desk を使っている場合は、下のボタンでアプリにも接続してください。</p>
    <div class="btns"><a class="btn primary" href="${esc(link)}">アプリで接続する</a><button class="btn" data-act="close">このままでよい</button></div>`);
}
setTimeout(schoolHandoffPane, 900);
if(location.port === "8765") window.__fdT = {get S(){ return S; }, get evDups(){ return evDups; }, concierge, dayMode, eventForm, closePane};
})();
</script>
