<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src https://script.google.com https://script.googleusercontent.com https://api.github.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Fold Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Fold Desk v6 — Apple HIG: clarity (large titles, one accent), deference (glass chrome over content), depth (springs, sheets).
   Four shapes: cover portrait = floating glass tab bar; cover landscape / main portrait = icon rail; main landscape = sidebar + docked pane. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#EFEFF4; --line:rgba(60,60,67,.13); --fg:#0B0B0F; --muted:#6C6C74;
  --accent:#0A62F5; --accent-2:#3C8CFF; --accent-ink:#FFFFFF; --accent-soft:#E5EDFF; --meet:#7A7F8A; --meet-soft:#ECEDF1;
  --warn:#F2382B; --warn-soft:#FFE6E3; --ok:#22B356; --chg:#FF9500;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.65);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 8px 28px rgba(16,24,40,.07);
  --shadow-lg:0 24px 60px rgba(10,20,50,.18),0 2px 6px rgba(10,20,50,.06);
  --f-ui:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --f-num:"Manrope","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:24px; --r-sm:14px;
  --spring:cubic-bezier(.34,1.45,.55,1); --sheet:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2A2A2E; --line:rgba(235,235,245,.12); --fg:#F5F5F7; --muted:#9A9AA2;
  --accent:#3D8BFF; --accent-2:#6AA8FF; --accent-ink:#FFFFFF; --accent-soft:#11264A; --meet:#9096A2; --meet-soft:#26272B;
  --warn:#FF5A4E; --warn-soft:#3B1715; --ok:#30D158; --chg:#FF9F0A;
  --glass:rgba(30,30,32,.7); --glass-line:rgba(255,255,255,.08); --shadow:0 1px 0 rgba(255,255,255,.03); --shadow-lg:0 24px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2A2A2E; --line:rgba(235,235,245,.12); --fg:#F5F5F7; --muted:#9A9AA2;
  --accent:#3D8BFF; --accent-2:#6AA8FF; --accent-ink:#FFFFFF; --accent-soft:#11264A; --meet:#9096A2; --meet-soft:#26272B;
  --warn:#FF5A4E; --warn-soft:#3B1715; --ok:#30D158; --chg:#FF9F0A;
  --glass:rgba(30,30,32,.7); --glass-line:rgba(255,255,255,.08); --shadow:0 1px 0 rgba(255,255,255,.03); --shadow-lg:0 24px 60px rgba(0,0,0,.6); color-scheme:dark}

html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- press physics ---------- */
.card button,.row,.pcard,.cell,.chip,.pill-btn,.btn,.icon-btn,.tab,.check,.cal button,.fab,.rail .add,.seg button,.prow.xrow{transition:transform .35s var(--spring),background-color .2s,color .2s,box-shadow .2s,opacity .2s}
:is(.row,.pcard,.cell,.chip,.pill-btn,.btn,.icon-btn,.tab,.cal button,.fab,.rail .add,.prow.xrow):active{transform:scale(.955);transition-duration:.08s}
.pcard:active,.row:active{transform:scale(.985)}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:1fr}
.rail{display:none}
main{overflow-y:auto;overscroll-behavior:contain;min-width:0;position:relative;scroll-behavior:smooth;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* compact nav bar that fades in when the large title scrolls away */
.navbar{position:sticky;top:0;z-index:15;height:0;margin-inline:-16px;pointer-events:none}
.navbar b{position:absolute;left:0;right:0;top:0;height:48px;display:grid;place-items:center;font-size:15.5px;font-weight:700;
  background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--line);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .35s var(--spring)}
main.scrolled .navbar b{opacity:1;transform:none}
body:not([data-mode="cover-p"]) .navbar{margin-inline:-28px}

/* floating glass tab bar (cover portrait) */
.tabbar{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 66px);
  bottom:calc(12px + env(safe-area-inset-bottom,0px));height:62px;border-radius:31px;display:flex;align-items:stretch;padding:4px;
  background:var(--glass);backdrop-filter:saturate(190%) blur(26px);-webkit-backdrop-filter:saturate(190%) blur(26px);
  border:.5px solid var(--glass-line);box-shadow:var(--shadow-lg)}
.tabbar .ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:27px;background:color-mix(in srgb,var(--accent) 13%,transparent);
  transition:transform .55s var(--spring),width .4s var(--spring);pointer-events:none}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:500;color:var(--muted);min-width:0;border-radius:24px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"] svg{animation:hop .5s var(--spring)}
@keyframes hop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:none}}
.fab{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:50%;color:#fff;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 20%,var(--accent-2),var(--accent));box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.fab svg{width:26px;height:26px;transition:transform .5s var(--spring)}
body.pane-open .fab svg{transform:rotate(45deg)}

/* rail */
body:not([data-mode="cover-p"]) #app{grid-template-columns:auto 1fr}
body[data-mode="main-l"].pane-open #app{grid-template-columns:auto 1fr 400px}
body:not([data-mode="cover-p"]) .tabbar{display:none}
body:not([data-mode="cover-p"]) .rail{display:flex;flex-direction:column;gap:3px;background:var(--glass);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:.5px solid var(--line);
  padding:16px 10px 14px max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
.rail .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-weight:800;letter-spacing:-.02em;font-size:17px;padding:4px 10px 16px}
.logo{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(140deg,var(--accent-2),var(--accent) 60%,#0637B8);position:relative;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo::before,.logo::after{content:"";position:absolute;border-radius:3px;background:rgba(255,255,255,.92)}
.logo::before{left:7px;top:7px;width:7px;height:16px}
.logo::after{left:16px;top:7px;width:7px;height:7px;opacity:.7}
.rail .tab{flex:none;flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;justify-content:flex-start;border-radius:13px}
.rail .tab[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.rail .tab[aria-current="page"] svg{animation:none}
.rail .sp{flex:1}
.rail .add{display:flex;align-items:center;gap:10px;color:#fff;border-radius:15px;padding:11px 12px;font-weight:700;font-size:14px;
  background:radial-gradient(120% 140% at 20% 0%,var(--accent-2),var(--accent))}
.rail .add svg{width:20px;height:20px}
:is(body[data-mode="cover-l"],body[data-mode="main-p"]) .rail :is(.brand span,.tab span,.add span,.status span){display:none}
:is(body[data-mode="cover-l"],body[data-mode="main-p"]) .rail{padding-inline:9px;align-items:center}
:is(body[data-mode="cover-l"],body[data-mode="main-p"]) .rail .brand{padding:4px 0 14px}
:is(body[data-mode="cover-l"],body[data-mode="main-p"]) .rail .tab{padding:10px}
:is(body[data-mode="cover-l"],body[data-mode="main-p"]) .rail .add{padding:11px}
body[data-mode="main-l"] .rail{width:220px}
body:not([data-mode="cover-p"]) .fab{display:none}
body:not([data-mode="cover-p"]) main{padding-bottom:40px}
body:is([data-mode="main-l"],[data-mode="main-p"]) main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
body[data-mode="cover-l"] main{padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- sheet / pane ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s}
body.pane-open #scrim{opacity:1;pointer-events:auto}
#pane{position:fixed;z-index:50;background:var(--surface);overflow-y:auto;overscroll-behavior:contain;
  left:0;right:0;bottom:0;max-height:90%;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .55s var(--sheet);
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));box-shadow:var(--shadow-lg)}
#pane::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
body.pane-open #pane{transform:none}
body:is([data-mode="cover-l"],[data-mode="main-p"]) #pane{left:auto;top:10px;bottom:10px;right:10px;width:min(440px,62%);max-height:none;border-radius:26px;transform:translateX(calc(100% + 20px));padding-top:18px}
body:is([data-mode="cover-l"],[data-mode="main-p"],[data-mode="main-l"]) #pane::before{display:none}
body[data-mode="main-l"] #pane{position:static;transform:none;display:none;max-height:none;border-radius:0;border-left:.5px solid var(--line);box-shadow:none;
  padding:22px max(22px,env(safe-area-inset-right,0px)) 26px 22px;background:var(--surface)}
body[data-mode="main-l"].pane-open #pane{display:block;animation:paneIn .5s var(--sheet)}
@keyframes paneIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
body[data-mode="main-l"] #scrim{display:none}
#pane > *{animation:rise .5s var(--spring) both}
#pane > :nth-child(2){animation-delay:.03s} #pane > :nth-child(3){animation-delay:.06s} #pane > :nth-child(n+4){animation-delay:.09s}
.pane-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pane-h h2{font-size:22px;font-weight:800;letter-spacing:-.01em;flex:1;margin:0;text-wrap:balance}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);flex:none}
.icon-btn svg{width:18px;height:18px}

/* ---------- entrance choreography (only when a view is first shown) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
main.enter .page-h,main.enter .grid > *,main.enter .stack > *,main.enter .tt-wrap,main.enter .toolbar,main.enter .pgrid > *,main.enter .legend{animation:rise .62s var(--spring) both}
main.enter .grid > :nth-child(2),main.enter .stack > :nth-child(1),main.enter .pgrid > :nth-child(2){animation-delay:.05s}
main.enter .grid > :nth-child(3),main.enter .stack > :nth-child(2),main.enter .pgrid > :nth-child(3),main.enter .toolbar{animation-delay:.1s}
main.enter .grid > :nth-child(4),main.enter .stack > :nth-child(3),main.enter .pgrid > :nth-child(4),main.enter .tt-wrap{animation-delay:.15s}
main.enter .grid > :nth-child(n+5),main.enter .stack > :nth-child(n+4),main.enter .pgrid > :nth-child(n+5),main.enter .legend{animation-delay:.2s}

/* ---------- type & blocks ---------- */
.page-h{display:flex;align-items:flex-end;gap:10px;margin:0 0 18px;padding-top:calc(22px + env(safe-area-inset-top,0px));flex-wrap:wrap}
.page-h h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0;flex:1;min-width:0}
.page-h .eyebrow{display:block;margin-bottom:2px}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:18px 18px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.005em;color:var(--fg);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13.5px;color:var(--accent);font-weight:700}
.card h3 span.more{color:var(--muted);font-family:var(--f-num)}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0 4px;margin:0}
.grid{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
body:not([data-mode="cover-p"]) .grid.today{grid-template-columns:1fr 1fr}
body[data-mode="main-l"].wide .grid.today{grid-template-columns:1.05fr 1fr 1fr}
body.pane-open[data-mode="main-l"] .grid.today{grid-template-columns:1fr 1fr}
body:not([data-mode="cover-p"]) .grid.two{grid-template-columns:1fr 1fr}
.span-all{grid-column:1/-1}

/* ---------- hero: living gradient + ring ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:30px;padding:20px 20px 18px;color:#fff;
  background:linear-gradient(150deg,#0B3FD6,#0A62F5 45%,#2C8DFF);box-shadow:0 18px 44px color-mix(in srgb,var(--accent) 32%,transparent)}
.hero .blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(36px);opacity:.75;will-change:transform}
.hero .b1{width:280px;height:280px;background:#64C3FF;right:-80px;top:-120px;animation:drift1 16s ease-in-out infinite alternate}
.hero .b2{width:240px;height:240px;background:#0A2B9E;left:-90px;bottom:-140px;animation:drift2 19s ease-in-out infinite alternate}
.hero .b3{width:160px;height:160px;background:#9FD8FF;left:40%;top:30%;opacity:.35;animation:drift1 23s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(-60px,50px) scale(1.15)}}
@keyframes drift2{to{transform:translate(70px,-40px) scale(1.2)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%);pointer-events:none}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero .date{display:flex;align-items:baseline;gap:10px}
.hero .date b{font-family:var(--f-num);font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero .date span{color:rgba(255,255,255,.8);font-size:15px;font-weight:700}
.hero .now{margin-top:12px;font-size:17px;font-weight:800;letter-spacing:-.005em;text-wrap:balance}
.hero .now small{display:block;font-weight:500;color:rgba(255,255,255,.8);font-size:13px;margin-top:3px}
.hero .seg.mini{background:rgba(255,255,255,.16);margin-top:14px;display:inline-flex}
.hero .seg.mini button{color:rgba(255,255,255,.85)}
.hero .seg.mini button[aria-pressed="true"]{background:#fff;color:var(--accent)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.2)}
.ring .arc{stroke:#fff;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.ring .lab b{font-family:var(--f-num);font-size:24px;font-weight:800;letter-spacing:-.03em}
.ring .lab small{font-size:10.5px;color:rgba(255,255,255,.8);font-weight:700}
.ring.idle .arc{stroke-dashoffset:0;opacity:.35}
.day{position:relative;margin-top:16px;height:30px;border-radius:11px;background:rgba(255,255,255,.14);overflow:visible}
.day .blk{position:absolute;top:4px;bottom:4px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-num);font-size:11.5px;font-weight:800;color:rgba(255,255,255,.9);background:rgba(255,255,255,.22);transform-origin:left;animation:grow .7s var(--spring) both}
.day .blk.joho{background:#fff;color:var(--accent)}
.day .blk.meeting{background:rgba(5,20,70,.32)}
.day .blk.free{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.day .blk.block{background:rgba(255,255,255,.28);top:13px;bottom:13px;border-radius:3px}
.day .blk.xev{background:transparent;box-shadow:inset 0 0 0 1.5px #fff;top:7px;bottom:7px}
.day .blk.past{opacity:.45}
@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
.day .nowline{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:#FFD43B;box-shadow:0 0 10px #FFD43B;transition:left 1s linear}
.day .nowline::before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#FFD43B;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,212,59,.7)}100%{box-shadow:0 0 0 12px rgba(255,212,59,0)}}
.day-labels{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:rgba(255,255,255,.75);margin-top:6px;font-weight:700}

/* ---------- period rows ---------- */
.seg.mini{margin:0;flex:none}
.seg.mini button{padding:5px 12px;font-size:12.5px;flex:none}
.prow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:.5px solid var(--line);position:relative}
.prow:first-child,.editbar + .prow{border-top:0}
.pno{font-family:var(--f-num);font-weight:800;font-size:19px;color:var(--muted);text-align:center}
.prow .t{font-weight:700;min-width:0}
.prow .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.prow .tm{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;font-weight:600;line-height:1.35}
.prow.block{padding:4px 0;border-top:0}
.prow.block .t{font-weight:500;font-size:12.5px;color:var(--muted)}
.prow.block .pno::before{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--line);margin:auto}
.prow.block .tm{white-space:nowrap;font-size:11.5px}
.prow.now{background:linear-gradient(100deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 40%,var(--surface)));margin:2px -10px;padding-inline:10px;border-radius:16px;border-color:transparent}
.prow.now .pno{color:var(--accent)}
.prow.now::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3.5px;border-radius:2px;background:var(--accent)}
.prow.now + .prow{border-color:transparent}
.prow.free .t{color:var(--muted);font-weight:500}
.prow.past{opacity:.5}
.suggest{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--fg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip svg{width:13px;height:13px}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.muted{color:var(--muted)}
button.chip[aria-pressed="true"],.chip.on{background:var(--fg);color:var(--bg)}
.chip.mini{font-size:10.5px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.cell.off{opacity:.35}

/* ---------- list rows ---------- */
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:.5px solid var(--line);text-align:left;width:100%}
.row:first-child,.sec + .row{border-top:0}
.row .main{min-width:0}
.row .main b{font-weight:700;display:block;overflow-wrap:anywhere}
.row .main small{color:var(--muted);font-size:12.5px;display:block;overflow-wrap:anywhere}
.check{position:relative;width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 45%,transparent);display:grid;place-items:center;flex:none}
.check svg{width:14px;height:14px;opacity:0;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.check[aria-pressed="true"] svg{opacity:1;stroke-dashoffset:0}
.check.pop{animation:popc .5s var(--spring) both;background:var(--ok);border-color:var(--ok);color:#fff}
.check.pop svg{opacity:1;animation:draw .35s .05s ease-out forwards}
.check.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--ok);animation:burst .6s ease-out forwards}
@keyframes popc{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burst{to{transform:scale(2.4);opacity:0}}
.row.completing .main b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok);transition:color .3s}
.row.completing{animation:collapse .45s .3s var(--ease) forwards}
@keyframes collapse{to{opacity:0;transform:translateX(24px)}}
.row.done .main b{color:var(--muted);text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.high{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.when{font-family:var(--f-num);font-size:12px;font-weight:800;color:var(--muted);text-align:right;white-space:nowrap}
.when.warn{color:var(--warn)} .when.accent{color:var(--accent)}
.bell{display:inline-grid;place-items:center;color:var(--accent)}
.bell svg{width:14px;height:14px}
.datebox{width:46px;text-align:center;border-radius:14px;background:var(--surface-2);padding:5px 0 4px;flex:none}
.datebox b{display:block;font-family:var(--f-num);font-weight:800;font-size:18px;line-height:1.05}
.datebox small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.datebox.today{background:var(--accent);color:#fff}
.datebox.today small{color:inherit;opacity:.85}

/* ---------- timetable ---------- */
.tt-wrap{overflow-x:auto;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:4px}
table.tt{width:100%;border-collapse:separate;border-spacing:6px;min-width:520px}
.tt th{font-weight:800;font-size:13px;color:var(--muted);padding:6px 0}
.tt th.today{color:var(--accent)}
.tt th small{display:block;font-size:11px;font-weight:600}
.tt th .chip.mini{margin:2px 0 0}
.tt td.pn{width:62px;text-align:center;vertical-align:middle}
.tt td.pn b{font-family:var(--f-num);font-size:21px;font-weight:800;display:block;line-height:1}
.tt td.pn small{font-family:var(--f-num);font-size:10.5px;color:var(--muted);font-weight:600}
.cell{position:relative;width:100%;min-height:64px;border-radius:16px;padding:8px 9px 7px;text-align:left;display:flex;flex-direction:column;justify-content:center;background:var(--surface-2)}
.cell b{font-size:14px;font-weight:800;line-height:1.25}
.cell small{font-family:var(--f-num);font-size:11.5px;opacity:.8;font-weight:700}
.cell.joho{background:linear-gradient(150deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.cell.meeting{background:var(--meet-soft);color:var(--meet)}
.cell.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.cell.todaycol:not(.joho){background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface-2))}
.cell.free.todaycol{background:transparent}
.cell.now{outline:2.5px solid var(--accent);outline-offset:2px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{outline-offset:4px}}
.cell.changed::after,.dotkey{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--chg);box-shadow:0 0 0 2px var(--surface)}
.dotkey{position:static;display:inline-block;vertical-align:0;margin-right:6px}
body[data-mode="cover-p"] .tt-wrap{padding:2px}
body[data-mode="cover-p"] table.tt{min-width:0;border-spacing:3px}
body[data-mode="cover-p"] .tt td.pn{width:30px}
body[data-mode="cover-p"] .tt td.pn b{font-size:16px}
body[data-mode="cover-p"] .cell{min-height:58px;padding:6px 5px;border-radius:12px}
body[data-mode="cover-p"] .cell b{font-size:12px}
body[data-mode="cover-p"] .cell small{font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:500}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11.5px;text-align:center;color:var(--muted);padding-bottom:4px;font-weight:700}
.cal button{aspect-ratio:1/1;max-width:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:14px}
.cal button.out{color:var(--muted);opacity:.4}
.cal button.today{color:var(--accent);font-weight:800}
.cal button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.cal .pips{display:flex;gap:2px;height:5px}
.cal .pips i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal button[aria-pressed="true"] .pips i{background:#fff}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-h b{flex:1;font-family:var(--f-num);font-size:19px;font-weight:800;letter-spacing:-.01em}

/* ---------- people ---------- */
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pcard{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;
  background:linear-gradient(150deg,var(--accent-2),var(--accent))}
.pcard .main{min-width:0;flex:1}
.pcard b{display:block;font-weight:800}
.pcard .org{font-size:12.5px;color:var(--muted)}
.pcard p{margin:6px 0 8px;font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- forms ---------- */
.seg{position:relative;display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08),0 .5px 0 rgba(0,0,0,.04);animation:segin .4s var(--spring)}
@keyframes segin{from{transform:scale(.9)}}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.input,.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:13px;padding:11px 13px;font-size:15px;min-width:0;transition:border-color .2s,background .2s,box-shadow .25s}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border-radius:15px;padding:13px 14px;font-weight:800;background:var(--surface-2);text-align:center}
.btn.primary{color:#fff;background:linear-gradient(150deg,var(--accent-2),var(--accent));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .input{flex:1;min-width:160px;background:var(--surface);box-shadow:var(--shadow)}
.pill-btn{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:13.5px}
.pill-btn svg{width:16px;height:16px}
.pill-btn.accent{color:#fff;background:linear-gradient(150deg,var(--accent-2),var(--accent));box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.pill-btn.danger{color:var(--warn)}
.memo{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.memo-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.memo-actions button{font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--surface-2);font-weight:700}
.memo-actions button.ai{background:var(--accent-soft);color:var(--accent)}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:20px 0 6px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:2px;font-weight:700}
.kv dd{margin:0;overflow-wrap:anywhere}
.copy{font-size:12px;color:var(--accent);margin-left:6px;font-weight:700}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .45s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .main{flex:1;min-width:0}
.setrow .main b{display:block;font-weight:700}
.setrow .main small{display:block;color:var(--muted);font-size:12.5px}
.setrow select{background:var(--surface-2);border:0;border-radius:10px;padding:7px 10px;font-weight:700}
.group{background:var(--surface-2);border-radius:18px;padding:2px 14px}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;color:#fff;background:linear-gradient(150deg,var(--accent-2),var(--accent))}
.kbd{display:inline-block;padding:0 7px;border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:13px}

/* ---------- status, brief, misc ---------- */
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.status.local i{background:var(--meet);box-shadow:none}
.brief{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.brief .bl{position:relative;padding:5px 0 5px 18px;font-size:14px;overflow-wrap:anywhere}
.brief .bl::before{content:"";position:absolute;left:3px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
a.chip{text-decoration:none}
.daycard h3{flex-wrap:wrap}
.daynav{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.page-h .daynav{margin-left:0}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm svg{width:15px;height:15px}
.editbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px;padding:10px 12px;border-radius:16px;background:var(--accent-soft);animation:rise .45s var(--spring)}
.hint{font-size:12px;color:var(--muted)}
.daycard.editing .prow:not(.block){background:color-mix(in srgb,var(--accent-soft) 45%,transparent);border-radius:12px;margin:3px -6px;padding-inline:6px;border-top-color:transparent;animation:wiggle .5s var(--spring)}
@keyframes wiggle{0%{transform:scale(.97)}100%{transform:none}}
.prow.cancel .t{color:var(--muted)}
.prow .t s{color:var(--muted)}
button.prow{width:100%;text-align:left}
.prow.xrow .pno{color:var(--accent);display:grid;place-items:center}
.prow.xrow .pno svg{width:17px;height:17px}
.after-div{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:12px;font-weight:800;color:var(--accent)}
.after-div i{flex:1;height:1px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.after-div .num{color:var(--muted);font-weight:600}
.editfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.editfoot.quiet{margin-top:8px}
.choice{display:grid;gap:10px}
.thinking{color:var(--accent);font-size:13.5px;padding:8px 0;font-weight:700}
.thinking::after{content:"";display:inline-block;width:14px;height:14px;margin-left:8px;vertical-align:-2px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tip{display:flex;gap:14px;align-items:center}
.tip .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(150deg,var(--accent-2),var(--accent))}
.tip .ic svg{width:24px;height:24px}
.tip .main{flex:1;min-width:0}
.tip .main b{display:block;font-weight:800}
.tip .main small{color:var(--muted);font-size:12.5px}

/* ---------- toast & banner (in-app notification) ---------- */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.9);background:var(--fg);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .5s var(--spring);z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
body:not([data-mode="cover-p"]) #toast{bottom:28px}
#banner{position:fixed;z-index:70;left:50%;top:calc(10px + env(safe-area-inset-top,0px));width:min(440px,calc(100% - 20px));transform:translate(-50%,-140%);
  border-radius:24px;padding:13px 14px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;
  background:var(--glass);backdrop-filter:saturate(190%) blur(28px);-webkit-backdrop-filter:saturate(190%) blur(28px);border:.5px solid var(--glass-line);box-shadow:var(--shadow-lg);
  transition:transform .6s var(--spring)}
#banner.on{transform:translate(-50%,0)}
#banner .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--accent-2),var(--accent))}
#banner .ic svg{width:22px;height:22px}
#banner.on .ic svg{animation:ring 1s .3s ease-in-out}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
#banner .bt{min-width:0}
#banner .bt small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
#banner .bt b{display:block;font-weight:800;font-size:14.5px;overflow-wrap:anywhere}
#banner .bt span{display:block;font-size:13px;color:var(--muted)}
#banner .bx{display:flex;gap:6px}

/* ---------- concierge ---------- */
#cc{position:fixed;left:0;top:0;width:86px;height:93px;z-index:35;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;opacity:0;transition:opacity .4s}
#cc.on.art{opacity:1}
#cc .spr{position:absolute;inset:0;background-size:800% 800%;background-repeat:no-repeat;transform-origin:50% 100%;
  filter:drop-shadow(0 6px 10px rgba(30,40,80,.18))}
#cc::before{content:"";position:absolute;left:22%;right:22%;bottom:-3px;height:8px;border-radius:50%;background:rgba(10,20,50,.16);filter:blur(2px);transition:transform .2s}
#cc.drag{cursor:grabbing}
#cc.drag .spr{transform:scale(1.08) rotate(-4deg)}
#cc.drag::before{transform:scale(.6) translateY(14px);opacity:.5}
#cc.land .spr{animation:land .45s var(--spring)}
@keyframes land{0%{transform:scale(1.1,.86)}100%{transform:none}}
#ccb{position:fixed;z-index:36;left:0;top:0;width:min(280px,calc(100vw - 24px));padding:14px 14px 12px;border-radius:22px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(190%) blur(26px);-webkit-backdrop-filter:saturate(190%) blur(26px);border:.5px solid var(--glass-line);box-shadow:var(--shadow-lg);
  transform-origin:var(--ox,50%) var(--oy,100%);transform:scale(.6);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .2s}
#ccb.on{transform:none;opacity:1;pointer-events:auto}
#ccb .nm{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:4px}
#ccb .ln{font-size:14px;line-height:1.5;padding:3px 0;overflow-wrap:anywhere}
#ccb .ln b{font-weight:800}
#ccb .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#ccb.say{width:auto;max-width:min(260px,calc(100vw - 24px));padding:10px 14px}
#ccb.say .ln{font-weight:700}
#ccb.talk{cursor:pointer}
#ccb.talk .ln{font-size:14.5px;font-weight:700;min-height:1.5em}
#ccb .setrow .seg.mini button{padding:5px 9px}

.ttrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ttrow .pno{width:26px;font-size:16px;flex:none}
.ttrow .input{padding:9px 10px;font-size:14.5px;min-width:0;flex:1}
.ttrow input[type=time]{flex:1 1 0;max-width:130px}
/* picker overlay (Drive / Contacts search) */
#picker{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 12px 12px}
#picker.on{display:flex;animation:fade .25s}
#picker .pk{width:min(520px,100%);max-height:80vh;overflow:auto;background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow-lg);animation:rise .45s var(--spring)}
.fileschips .chip button{color:var(--muted);font-weight:800}
/* setup */
body.unpaired #tabbar,body.unpaired #fab,body.unpaired #rail,body.unpaired #cc,body.unpaired #ccb{display:none!important}
body.unpaired #app{grid-template-columns:1fr!important}
.setup{max-width:440px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 4px 40px;text-align:center}
.setup h1{font-size:34px;font-weight:800;margin:16px 0 6px;letter-spacing:-.02em}
.setup .lead{color:var(--muted);margin:0 0 20px}
.logo.big{width:84px;height:84px;border-radius:24px;margin:0 auto;display:block}
.logo.big::before{left:20px;top:20px;width:19px;height:44px;border-radius:7px}
.logo.big::after{left:45px;top:20px;width:19px;height:19px;border-radius:7px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.automode{font-size:12px;font-weight:600;opacity:.85;margin-top:6px}
</style>
</head>
<body>

<div id="app">
  <nav class="rail" id="rail" aria-label="メニュー"></nav>
  <main id="view" tabindex="-1"></main>
  <aside id="pane" aria-label="詳細"></aside>
  <nav class="tabbar" id="tabbar" aria-label="メニュー"></nav>
</div>
<button class="fab" id="fab" aria-label="追加"></button>
<div id="scrim"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="banner" role="alert" aria-live="assertive"></div>
<div id="picker" role="dialog" aria-modal="true"></div>
<div id="cc" role="button" aria-label="コンシェルジュ（タップで今日の案内）" tabindex="0"><div class="spr"></div></div>

<script>
(() => {
"use strict";
/* ================= icons ================= */
const I = {
  today:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v10a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/>',
  tt:'<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M9.2 4v16M14.8 4v16"/>',

  people:'<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.6c2.3.1 4 1.6 4.6 4.1"/>',
  memo:'<path d="M6 4h9l4 4v12H6z"/><path d="M14.5 4v4.5H19M9 12.5h7M9 16h5"/>',

  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',

  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  left:'<path d="m14.5 6-6 6 6 6"/>', right:'<path d="m9.5 6 6 6-6 6"/>',
  card:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="8.5" cy="11.2" r="1.8"/><path d="M6 15.2c.5-1.2 1.4-1.8 2.5-1.8s2 .6 2.5 1.8M13.5 10h5M13.5 13h3.5"/>',
  spark:'<path d="M12 3.5l1.7 4.8 4.8 1.7-4.8 1.7L12 16.5l-1.7-4.8L5.5 10l4.8-1.7z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  bell:'<path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4z"/>',
  home:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="M12 7v6M9 10h6"/>',
  phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>'
};
const ico = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
const ini = (n) => (String(n||"?").replace(/^[\s【\[（(「『]+[^】\])）」』]*[】\])）」』]\s*/,"").replace(/^[^\p{L}\p{N}]+/u,"") || "?").slice(0,1);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);

/* ================= dates ================= */
const WD = ["日","月","火","水","木","金","土"];
const DAYKEYS = ["mon","tue","wed","thu","fri"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayS = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const mins = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const nowMin = () => { const d = new Date(); return d.getHours()*60+d.getMinutes(); };
function remain(due, done){
  if(!due) return {t:"", c:""};
  if(done) return {t:md(due), c:""};
  const d = diff(due, todayS());
  if(d < 0) return {t:`${-d}日超過`, c:"warn"};
  if(d === 0) return {t:"今日", c:"accent"};
  if(d === 1) return {t:"明日", c:"accent"};
  return {t:`あと${d}日`, c:""};
}

/* ================= store ================= */
const COLS = ["tasks","events","people","orgs","memos","logs","progress","followups","briefs","overrides"];
const S = { tasks:[], events:[], people:[], orgs:[], memos:[], logs:[], progress:[], followups:[], briefs:[], overrides:[], tt:null, days:{}, prefs:{}, ready:false, local:false };
let db = null, sample = null, sampleImages = false, mcp = null;
const GCAL = "Google Calendar";
const PREF_DEF = { classBefore:3, eventBefore:10, afterBefore:10, morning:true, mergeEvents:true, autoMode:true };
const pref = k => (S.prefs && S.prefs[k] !== undefined) ? S.prefs[k] : PREF_DEF[k];
async function putPrefs(p){
  const next = {...PREF_DEF, ...(S.prefs||{}), ...p};
  if(db){ try { await db.doc("config/prefs").set(next); } catch(e){ toast("保存できませんでした"); } }
  else { S.prefs = next; saveLocal(); schedule(); }
}
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const LKEY = "folddesk-local-v1";

function loadLocal(){
  try { const j = JSON.parse(localStorage.getItem(LKEY) || "null"); if(j){ COLS.forEach(c => S[c] = j[c] || []); S.tt = j.tt || null; S.days = j.days || {}; S.prefs = j.prefs || {}; } } catch(e){}
}
function saveLocal(){ try { const o = {}; COLS.forEach(c => o[c] = S[c]); o.tt = S.tt; o.days = S.days; o.prefs = S.prefs; localStorage.setItem(LKEY, JSON.stringify(o)); } catch(e){} }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

async function put(col, id, obj){
  id = id || newId();
  const body = JSON.parse(JSON.stringify({...obj, updatedAt: new Date().toISOString()}));
  delete body.id;
  if(db){
    try { await db.collection(col).doc(id).set(body); }
    catch(e){ toast(e && e.code === "quota_exceeded" ? "保存できる件数の上限に達しました" : "保存できませんでした。通信状態を確認してください"); throw e; }
  } else {
    const arr = S[col]; const i = arr.findIndex(x => x.id === id);
    if(i >= 0) arr[i] = {...body, id}; else arr.push({...body, id});
    saveLocal(); schedule();
  }
  return id;
}
async function del(col, id){
  if(db){ try { await db.collection(col).doc(id).delete(); } catch(e){ toast("削除できませんでした"); throw e; } }
  else { S[col] = S[col].filter(x => x.id !== id); saveLocal(); schedule(); }
}
async function setDayMode(mode, date){
  const t = date || todayS(), next = {};
  Object.keys(S.days || {}).forEach(k => { if(k >= addDays(todayS(), -60)) next[k] = S.days[k]; });
  if(mode === "normal" && !holidayOf(t) && !autoModeOf(t)) delete next[t]; else next[t] = mode;
  const msg = `${t === todayS() ? "今日" : md(t)}は${mode === "off" ? "授業なし（休み）" : OFFICIAL[mode].label + "時程"}にしました`;
  if(db){ try { await db.doc("config/days").set(next); toast(msg); } catch(e){ toast("保存できませんでした"); } }
  else { S.days = next; saveLocal(); schedule(); toast(msg); }
}
async function putTT(tt){
  if(db){ try { await db.doc("config/timetable").set(JSON.parse(JSON.stringify(tt))); } catch(e){ toast("保存できませんでした"); throw e; } }
  else { S.tt = tt; saveLocal(); schedule(); }
}

/* ================= defaults ================= */
const DEFAULT_TT = {
  periods:[{n:1,start:"08:50",end:"09:35"},{n:2,start:"09:45",end:"10:30"},{n:3,start:"10:50",end:"11:35"},{n:4,start:"11:45",end:"12:30"},{n:5,start:"13:30",end:"14:15"}],
  grid:{ mon:[{},{},{},{},{}], tue:[{},{},{},{},{}], wed:[{},{},{},{},{}], thu:[{},{},{},{},{}], fri:[{},{},{},{},{}] }
};
const tt = () => S.tt || DEFAULT_TT;
const cellKind = c => !c || !c.subject ? "free" : c.kind === "meeting" ? "meeting" : /情報/.test(c.subject) ? "joho" : "class";

/* ================= router & mode ================= */
const VIEWS = [
  {k:"today", l:"今日", i:"today"}, {k:"timetable", l:"時間割", i:"tt"}, {k:"tasks", l:"タスク", i:"tasks"},
  {k:"events", l:"予定", i:"events"}, {k:"people", l:"人", i:"people"}, {k:"memo", l:"メモ", i:"memo"}
];
let view = "today";
const ui = { day:null, week:0, edit:false, taskFilter:"open", peopleQ:"", peopleTie:"", calMonth:null, calSel:null, pane:null };

function setMode(){
  const w = innerWidth, h = innerHeight;
  let m;
  if(w < 600 && h >= w) m = "cover-p";
  else if(w >= h && h < 560) m = "cover-l";
  else if(h > w) m = "main-p";
  else m = "main-l";
  if(w < 420) m = "cover-p";
  document.body.classList.toggle("wide", m === "main-l" && w >= 1150);
  if(document.body.dataset.mode !== m){ document.body.dataset.mode = m; schedule(); }
}
addEventListener("resize", () => { setMode(); if(navBuilt) renderNav(); });

function readHash(){ const k = location.hash.slice(1); if(VIEWS.some(v => v.k === k)) view = k; }
addEventListener("hashchange", () => { readHash(); schedule(); $("#view").scrollTop = 0; });
function go(k){ if(location.hash.slice(1) !== k) location.hash = k; else { view = k; schedule(); } }

/* ================= render loop ================= */
let rafId = 0;
function schedule(){ if(!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }
setInterval(() => { if(view === "today" || view === "timetable") schedule(); }, 30000);

let navBuilt = false;
function renderNav(){
  if(!navBuilt){
    navBuilt = true;
    const tabs = VIEWS.map(v => `<button class="tab" data-go="${v.k}">${ico(v.i)}<span>${v.l}</span></button>`).join("");
    $("#tabbar").innerHTML = `<span class="ind" aria-hidden="true"></span>${tabs}`;
    $("#rail").innerHTML = `<div class="brand"><i class="logo" aria-hidden="true"></i><span>Fold Desk</span></div>${tabs}
      <button class="tab" data-act="search">${ico("search")}<span>検索</span></button>
      <button class="tab" data-act="settings">${ico("gear")}<span>通知と設定</span></button>
      <div class="sp"></div>
      <button class="add" data-act="add">${ico("plus")}<span>追加</span></button>
      <div class="status" id="syncst" style="padding:10px 6px 0"><i></i><span></span></div>`;
    $("#fab").innerHTML = ico("plus");
  }
  document.querySelectorAll(".tab[data-go]").forEach(b => { if(b.dataset.go === view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const st = $("#syncst"); st.classList.toggle("local", S.local); st.querySelector("span").textContent = S.local ? "この端末のみ" : "同期中";
  const bar = $("#tabbar"), cur = bar.querySelector('[aria-current="page"]'), ind = bar.querySelector(".ind");
  if(cur && bar.offsetWidth){ ind.style.width = cur.offsetWidth + "px"; ind.style.transform = `translateX(${cur.offsetLeft - 4}px)`; }
}

const TITLES = {today:"今日", timetable:"時間割", tasks:"タスク", events:"予定", people:"人", memo:"メモ"};
let lastView = null;
function render(){
  renderNav();
  const v = $("#view");
  const changed = lastView !== view; lastView = view;
  const st = changed ? 0 : v.scrollTop;
  const ok = paired() && syncState !== "auth";
  document.body.classList.toggle("unpaired", !ok);
  if(!ok){ v.innerHTML = setupView(); return; }
  v.innerHTML = `<div class="navbar" aria-hidden="true"><b>${TITLES[view] || ""}</b></div>` + ({today:vToday, timetable:vTT, tasks:vTasks, events:vEvents, people:vPeople, memo:vMemo}[view] || vToday)();
  if(changed){ v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); render.at = performance.now(); }
  else if(performance.now() - (render.at||0) > 700) v.classList.remove("enter");
  v.scrollTop = st;
  if(changed) setTimeout(tick, 350); else tick();
  if(ui.pane && ui.paneLive && !$("#pane").contains(document.activeElement)) ui.paneLive();
  pushSnapshot();
}
$("#view").addEventListener("scroll", e => e.target.classList.toggle("scrolled", e.target.scrollTop > 56), {passive:true});

/* ================= shared pieces ================= */
function taskRow(t){
  const r = remain(t.due, t.status === "done");
  const who = (t.personIds||[]).map(pid => S.people.find(p => p.id === pid)?.name).filter(Boolean).join("・");
  const sub = [t.area, who].filter(Boolean).join(" · ");
  return `<div class="row ${t.status==='done'?'done':''}">
    <button class="check" data-toggle="${t.id}" aria-pressed="${t.status==='done'}" aria-label="完了にする">${ico("check")}</button>
    <button class="main" data-open-task="${t.id}" style="text-align:left"><b>${esc(t.title)}</b>${sub?`<small>${esc(sub)}</small>`:""}</button>
    <span style="display:flex;align-items:center;gap:8px">${t.remindAt && t.status !== "done" && new Date(t.remindAt) > new Date() ? `<span class="bell" title="${esc(t.remindAt.replace("T"," "))} に通知">${ico("bell")}</span>` : ''}${t.priority==="high"?'<i class="dot high" title="優先度 高"></i>':''}<span class="when ${r.c}">${esc(r.t)}</span></span>
  </div>`;
}
function eventRow(e){
  const d = parse(e.date);
  return `<button class="row" data-open-event="${e.id}" style="grid-template-columns:auto 1fr">
    <span class="datebox ${e.date===todayS()?'today':''}"><b>${d.getDate()}</b><small>${d.getMonth()+1}月 ${WD[d.getDay()]}</small></span>
    <span class="main"><b>${esc(e.title)}</b><small>${[...new Set([e, ...(evDups[e.id] || [])].map(x => x.account).filter(Boolean))].map(a => `<span class="chip mini ${a === '学校' ? 'accent' : ''}">${esc(a)}</span>`).join("")}${(evDups[e.id] || []).length ? `<span class="chip mini">${(evDups[e.id] || []).length + 1}件</span>` : ''}${e.remindMin ? `<span class="bell" style="vertical-align:-2px;margin-right:4px">${ico("bell")}</span>` : ''}${esc([e.time ? e.time + (e.endTime ? "–" + e.endTime : "") : "", e.place, e.kind].filter(Boolean).join(" · "))}</small></span>
  </button>`;
}
const openTasks = () => S.tasks.filter(t => t.status !== "done").sort((a,b) => (a.due||"9999").localeCompare(b.due||"9999") || ((a.priority==="high"?0:1)-(b.priority==="high"?0:1)));
const upcoming = (n=7) => { const t = todayS(), e = addDays(t, n); return S.events.filter(x => x.date >= t && x.date <= e).sort((a,b) => (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))); };
const orgName = id => S.orgs.find(o => o.id === id)?.name || "";
const daysSince = s => s ? diff(todayS(), s) : null;

/* ---------- official school schedule (2026年度 授業時程) ---------- */
const TM = (s,e) => ({start:s, end:e});
const OFFICIAL_DEFAULT = {
  normal:{ label:"通常", dismiss:"15:00",
    low:[TM("08:45","09:30"),TM("09:40","10:25"),TM("10:45","11:30"),TM("11:40","12:25"),TM("13:30","14:15")],
    upper:[TM("08:45","09:30"),TM("09:40","10:25"),TM("10:45","11:30"),TM("11:40","12:25"),TM("13:30","14:15"),TM("14:25","15:10")],
    blocks:[{label:"朝の会",...TM("08:30","08:40")},{label:"中休み",...TM("10:25","10:45")},{label:"給食・昼休み",...TM("12:25","13:30")},{label:"帰りの会",...TM("14:20","14:35")}] },
  short:{ label:"短縮", dismiss:"13:00",
    low:[TM("08:45","09:30"),TM("09:40","10:25"),TM("10:35","11:20"),null,null],
    upper:[TM("08:45","09:30"),TM("09:40","10:25"),TM("10:35","11:20"),TM("11:30","12:15"),null,null],
    blocks:[{label:"朝の会",...TM("08:30","08:40")},{label:"給食",...TM("11:20","12:20")},{label:"帰りの会",...TM("12:30","12:45")}] },
  assembly:{ label:"朝会", dismiss:"15:00",
    low:[TM("09:05","09:50"),TM("10:00","10:45"),TM("10:55","11:40"),TM("11:45","12:30"),TM("13:30","14:15")],
    upper:[TM("09:05","09:50"),TM("10:00","10:45"),TM("10:55","11:40"),TM("11:45","12:30"),TM("13:30","14:15"),TM("14:25","15:10")],
    blocks:[{label:"朝の会",...TM("08:30","08:40")},{label:"朝会",...TM("08:45","09:05")},{label:"給食・昼休み",...TM("12:30","13:30")}] }
};
const OFF_DEF = {label:"休み", dismiss:"", low:[], upper:[], blocks:[]};
let OFFICIAL = {...OFFICIAL_DEFAULT, off:OFF_DEF}, SCHOOL = null;
function applySchool(c){
  SCHOOL = c || null;
  OFFICIAL = {...(c && c.official && c.official.normal ? c.official : OFFICIAL_DEFAULT), off:OFF_DEF};
  AREAS = c && Array.isArray(c.areas) && c.areas.length ? c.areas : AREAS_DEFAULT;
  EKINDS = c && Array.isArray(c.ekinds) && c.ekinds.length ? c.ekinds : EKINDS_DEFAULT;
}
const MODES = ["normal","short","assembly"];
const DAY_MODES = [...MODES, "off"];
/* an all-day event of kind 休み (holiday, school closure, substitute day off) means no classes */
const holidayOf = s => S.events.find(e => e.date === s && !e.time && e.kind === "休み") || null;
const bandOf = c => { const g = String((c && c.cls) || "").match(/^([0-9])-/); return g && upperGrades().includes(g[1]) ? "upper" : "low"; };
/* an all-day (or early-morning) event whose name contains a schedule's name, e.g. 「短縮日課」「児童朝会」, switches that day automatically.
   A choice made by hand for the day always wins. */
const reEsc = x => String(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function autoModeOf(s){
  if(pref("autoMode") === false || !S.events) return null;
  const evs = S.events.filter(e => e.date === s && (!e.time || e.time < "09:00") && e.kind !== "休み");
  for(const k of ["short", "assembly"]){
    const lb = (OFFICIAL[k] || {}).label; if(!lb) continue;
    const re = new RegExp(reEsc(lb) + (k === "short" ? "|短縮日課|短縮授業|短縮時程" : "|全校朝会|児童朝会"));
    const e = evs.find(x => re.test(x.title || "")); if(e) return {mode:k, ev:e};
  }
  return null;
}
const dayMode = (s = todayS()) => (S.days && S.days[s]) || (holidayOf(s) ? "off" : ((autoModeOf(s) || {}).mode || "normal"));
const isWeekday = s => { const w = parse(s).getDay(); return w >= 1 && w <= 5; };
const getOv = s => S.overrides.find(o => o.id === s) || null;
const plusMin = (t, m) => { const x = mins(t) + m; return `${pad(Math.floor(x/60) % 24)}:${pad(x % 60)}`; };
const evEnd = e => e.endTime && mins(e.endTime) > mins(e.time) ? e.endTime : plusMin(e.time, 60);
function dayItems(dateS){
  const wd = parse(dateS).getDay(), weekday = wd >= 1 && wd <= 5;
  const M = OFFICIAL[dayMode(dateS)], ov = getOv(dateS) || {}, items = [];
  if(weekday){
    const row = tt().grid[DAYKEYS[wd-1]] || [];
    for(let i = 0, np = NP(); i < np; i++){
      const o = ov.cells && ov.cells[i], base = row[i] || {};
      const cell = o && !o.cancel ? o : base;
      const t = M[bandOf(cell)][i] || (o && !o.cancel ? (M.low[i] || M.upper[i]) : null);
      if(!t) continue;
      items.push({type:"period", n:i+1, cell, base, ...t, changed:!!o, cancelled:!!(o && o.cancel)});
    }
    M.blocks.forEach(b => items.push({type:"block", ...b}));
  }
  (ov.extra || []).forEach((x, idx) => {
    let st = x.start, en = x.end;
    if(x.period){ const t = M.low[x.period-1] || M.upper[x.period-1]; if(t){ st = t.start; en = t.end; } }
    if(st) items.push({type:"extra", idx, label:x.title, kind:x.kind, note:x.note, start:st, end: en && mins(en) > mins(st) ? en : plusMin(st, 30)});
  });
  S.events.filter(e => e.date === dateS && e.time).forEach(e => items.push({type:"event", id:e.id, label:e.title, kind:e.kind, start:e.time, end:evEnd(e)}));
  if(!items.length) return null;
  return items.sort((a,b) => mins(a.start) - mins(b.start) || (a.type === "block" ? -1 : 1));
}
function todayPeriods(){ const it = dayItems(todayS()); return it ? it.filter(x => x.type === "period" && !x.cancelled) : null; }
function currentState(){
  const it = (dayItems(todayS()) || []).filter(x => !x.cancelled);
  if(!it.length) return {weekend:true};
  const n = nowMin();
  const cur = it.filter(x => n >= mins(x.start) && n < mins(x.end)).sort((a,b) => (a.type==="block") - (b.type==="block"))[0];

/* live ring + now line, updated every second without re-rendering */
function tick(){
  const arc = document.getElementById("ring-arc"); if(!arc) return;
  const st = currentState(), d = new Date(), sec = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
  let frac = 0, num = null, sub = null;
  if(st.cur){ const a = mins(st.cur.start)*60, b = mins(st.cur.end)*60; frac = (sec - a) / Math.max(1, b - a); const l = b - sec; num = l >= 600 ? Math.ceil(l/60) : `${Math.floor(l/60)}:${pad(l%60)}`; sub = l >= 600 ? "分 のこり" : "のこり"; }
  else if(st.before){ const b = mins(st.before.start)*60, l = b - sec; frac = 1 - Math.min(1, l / 600); num = l >= 600 ? Math.ceil(l/60) : `${Math.floor(l/60)}:${pad(l%60)}`; sub = l >= 600 ? "分 まで" : "まで"; }
  else { num = `${d.getHours()}:${pad(d.getMinutes())}`; sub = "いま"; frac = 1; }
  arc.style.strokeDashoffset = (276.5 * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1);
  const n = document.getElementById("ring-num"); if(n && n.textContent !== String(num)) n.textContent = num;
  const s = document.getElementById("ring-sub"); if(s && s.textContent !== sub) s.textContent = sub;
  const nl = document.getElementById("nowline"); if(nl){ nl.style.left = ((sec/60 - +nl.dataset.s0) / +nl.dataset.span * 100) + "%"; }
}

  const memoCard = `<div class="card"><h3>メモ<button class="more" data-go="memo">一覧</button></h3>
      <form data-form="quickmemo" style="display:flex;gap:8px"><input class="input" id="qm" name="text" placeholder="思いついたことを書く" autocomplete="off"><button class="pill-btn accent" type="submit">追加</button></form>
      ${S.memos.filter(m=>!m.done).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,3).map(m => `<div class="row" style="grid-template-columns:1fr"><span class="memo">${esc(m.text)}</span></div>`).join("")}</div>`;

/* ================= TIMETABLE ================= */
function vTT(){
  const G = tt(), t = todayS(), st = currentState(), N = OFFICIAL.normal.low;
  const ds = weekDates(ui.week);
  const head = `<tr><th></th>${ds.map((s,i) => { const m = dayMode(s); return `<th class="${s===t?'today':''}">${["月","火","水","木","金"][i]}<small class="num">${md(s).replace(/\(.\)/,'')}</small>${m!=="normal"?`<span class="chip mini ${m==='short'?'warn':''}">${OFFICIAL[m].label}</span>`:''}</th>`; }).join("")}</tr>`;
  const rows = Array.from({length:NP()}, (_, i) => i).map(pi => `<tr><td class="pn"><b>${pi+1}</b><small>${((N[pi] || OFFICIAL.normal.upper[pi] || {}).start) || ""}</small></td>${DAYKEYS.map((dk, di) => {
      const s = ds[di], base = (G.grid[dk]||[])[pi] || {}, o = ((getOv(s)||{}).cells||{})[pi];
      const c = o && !o.cancel ? o : base, cancelled = !!(o && o.cancel);
      const k = cancelled ? "free" : cellKind(c), isToday = s === t;
      const isNow = isToday && st.cur && st.cur.type === "period" && st.cur.n === pi+1;
      const off = cancelled || !OFFICIAL[dayMode(s)][bandOf(c)][pi];
      return `<td><button class="cell ${k} ${isToday?'todaycol':''} ${isNow?'now':''} ${off?'off':''} ${o?'changed':''}" data-tcell="${s}:${pi}:${dk}" aria-label="${md(s)} ${pi+1}時間目 ${esc(cancelled ? 'なし' : cellText(c))}">
        <b>${cancelled ? 'なし' : (k==='free' ? '' : esc(c.subject))}</b>${!cancelled && c.cls ? `<small>${esc(c.cls)}</small>` : ''}</button></td>`; }).join("")}</tr>`).join("");
  const counts = {joho:0, class:0, meeting:0, free:0};
  DAYKEYS.forEach(dk => (G.grid[dk]||[]).forEach(c => counts[cellKind(c)]++));
  const nChanged = ds.reduce((a,s) => a + Object.keys(((getOv(s)||{}).cells)||{}).length + (((getOv(s)||{}).extra)||[]).length, 0);
  return `<div class="page-h"><h1>時間割</h1><span class="daynav"><button class="icon-btn" data-week="-1" aria-label="前の週">${ico("left")}</button><button class="chip" data-week="0" aria-pressed="${ui.week===0}">今週</button><button class="icon-btn" data-week="1" aria-label="次の週">${ico("right")}</button></span><button class="pill-btn" data-act="periods">時程表</button><button class="pill-btn accent" data-tt-open>${ico("tt")}登録・編集</button></div>
    ${DAYKEYS.every(dk => !(G.grid[dk] || []).some(c => c && c.subject)) ? `<div class="card tip" style="margin-bottom:14px"><span class="ic">${ico("tt")}</span><span class="main"><b>時間割を登録しましょう</b><small>手で入れるか、Excel・スプレッドシートの表（CSV）から読み込めます</small></span><button class="pill-btn accent" data-tt-open>登録</button></div>` : ""}
    ${nChanged ? `<p class="hint" style="margin:-6px 0 10px">この週は ${nChanged} か所の変更があります（オレンジの点）。</p>` : ''}
    <div class="tt-wrap"><table class="tt">${head}${rows}</table></div>
    <div class="legend"><span><i style="background:linear-gradient(150deg,var(--accent-2),var(--accent))"></i>情報探究 ${counts.joho}</span>
      <span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)"></i>1年の授業 ${counts.class}</span><span><i style="background:var(--meet-soft)"></i>会議 ${counts.meeting}</span>
      <span><i style="box-shadow:inset 0 0 0 1.5px var(--line)"></i>空き ${counts.free}</span><span><i class="dotkey"></i>その日だけ変更</span></div>
    <p class="empty" style="margin-top:6px">コマをタップすると「この日だけ変える」か「毎週の時間割を変える」を選べます。左の時刻は通常時程です。まとめて直すときは「登録・編集」から。</p>
    <div class="page-h" style="padding-top:28px;margin-bottom:12px"><h1 style="font-size:24px">授業の進度</h1><button class="pill-btn" data-progress="new">${ico("plus")}教科を追加</button></div>
    ${(() => { const us = teachUnits(), groups = [["1年（担任）", us.filter(u => !u.cls)], ["情報探究", us.filter(u => u.cls && JOHO.test(u.subject))], ["そのほか", us.filter(u => u.cls && !JOHO.test(u.subject))]].filter(g => g[1].length);
      return groups.map(([g, xs]) => `<div class="sec">${g}</div><div class="pgrid">${xs.map(u => { const lp = lastProg(u.subject, u.cls), b = behind(u.subject, u.cls);
        return `<button class="pcard" data-progress="${esc(pkey(u.subject, u.cls))}"><span class="avatar ${u.cls ? 'num' : ''}" style="font-size:${u.cls ? 14 : 16}px">${esc(u.cls || u.subject.slice(0,1))}</span><span class="main"><b>${esc(u.cls ? u.subject : u.subject)}</b>
          <span class="org">${lp ? esc(progLabel(lp)) + ' · ' + esc(md(lp.date)) : 'タップして記録'}</span>${lp && lp.next ? `<p>次回：${esc(lp.next)}</p>` : ''}${b>0 ? `<span class="chip warn">${b}時間 遅れ</span>` : ''}</span></button>`; }).join("")}</div>`).join(""); })()}`;
}


/* ================= TASKS ================= */
function vTasks(){
  const t = todayS(), f = ui.taskFilter;
  let list = S.tasks.slice();
  if(f === "open") list = openTasks();
  else if(f === "today") list = openTasks().filter(x => x.due && x.due <= t);
  else if(f === "week") list = openTasks().filter(x => x.due && x.due <= addDays(t,7));
  else if(f === "done") list = S.tasks.filter(x => x.status === "done").sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const areas = [...new Set(S.tasks.map(x => x.area).filter(Boolean))];
  const groups = f === "done" ? [["完了", list]] : areas.length > 1 && document.body.dataset.mode !== "cover-p"
    ? [...areas.map(a => [a, list.filter(x => x.area === a)]), ["その他", list.filter(x => !x.area)]].filter(g => g[1].length)
    : [["", list]];
  const chips = [["open","未完了"],["today","今日まで"],["week","1週間"],["done","完了"]].map(([k,l]) => `<button class="chip" data-tf="${k}" aria-pressed="${f===k}">${l}</button>`).join("");
  const body = list.length ? (groups.length > 1 ? `<div class="grid two">${groups.map(([g, xs]) => `<div class="card"><h3>${esc(g)}<span class="more" style="color:var(--muted)">${xs.length}</span></h3>${xs.map(taskRow).join("")}</div>`).join("")}</div>`
      : `<div class="card">${list.map(taskRow).join("")}</div>`)
    : `<div class="card"><p class="empty">${f==='done'?'完了したタスクはまだありません。':'該当するタスクはありません。'}</p></div>`;
  const fc = f !== "done" ? followCard() : "";
  return `<div class="page-h"><h1>タスク</h1><button class="pill-btn accent" data-new="task">${ico("plus")}新規</button></div>
    <div class="toolbar">${chips}</div>${fc ? `<div style="margin-bottom:14px">${fc}</div>` : ''}${body}`;
}

/* ================= EVENTS ================= */
function vEvents(){
  const t = todayS();
  if(!ui.calMonth) ui.calMonth = t.slice(0,7);
  if(!ui.calSel) ui.calSel = t;
  const [y, m] = ui.calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1), start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const byDate = {}; S.events.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = "";
  for(let i=0;i<42;i++){ const d = new Date(start); d.setDate(start.getDate()+i); const s = ymd(d);
    const n = (byDate[s]||[]).length;
    cells += `<button data-day="${s}" class="${d.getMonth()!==m-1?'out':''} ${s===t?'today':''}" aria-pressed="${s===ui.calSel}" aria-label="${md(s)} 予定${n}件"><span>${d.getDate()}</span><span class="pips">${"<i></i>".repeat(Math.min(n,3))}</span></button>`; }
  const sel = (byDate[ui.calSel]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const up = S.events.filter(e => e.date >= t).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).slice(0,12);
  const cal = `<div class="card"><div class="cal-h"><button class="icon-btn" data-cal="-1" aria-label="前の月">${ico("left")}</button><b>${y}年 ${m}月</b>
      <button class="chip" data-cal="0">今月</button><button class="icon-btn" data-cal="1" aria-label="次の月">${ico("right")}</button></div>
      <div class="cal">${["月","火","水","木","金","土","日"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells}</div></div>`;
  const day = `<div class="card"><h3>${md(ui.calSel)}<button class="more" data-new="event" data-date="${ui.calSel}">この日に追加</button></h3>${sel.length ? sel.map(eventRow).join("") : '<p class="empty">予定はありません。</p>'}</div>`;
  const list = `<div class="card"><h3>これからの予定</h3>${up.length ? up.map(eventRow).join("") : '<p class="empty">まだ予定がありません。Googleカレンダーの予定は、チャットで頼めば取り込めます。</p>'}</div>`;
  return `<div class="page-h"><h1>予定</h1><button class="pill-btn accent" data-new="event">${ico("plus")}新規</button></div>
    <div class="grid two"><div class="stack">${cal}${day}</div><div class="stack">${list}</div></div>`;
}

      <b>${esc(p.name)}</b><span class="org">${esc([orgName(p.orgId), p.role].filter(Boolean).join(" · "))}</span>

/* ================= reminders (in-app) ================= */
const atOf = (dateS, hm) => { const d = parse(dateS); const [h, m] = hm.split(":").map(Number); d.setHours(h, m, 0, 0); return d; };
function reminderList(fromMs, toMs){
  const out = [], t = todayS();
  [t, addDays(t, 1)].forEach(ds => {
    const items = (dayItems(ds) || []).filter(x => !x.cancelled), M = OFFICIAL[dayMode(ds)], dis = isWeekday(ds) ? mins(M.dismiss) : 0;
    items.forEach(x => {
      let before = null, title = "", body = `${x.start}〜${x.end}`;
      if(x.type === "period"){ if(cellKind(x.cell) === "free") return; before = pref("classBefore"); title = `${x.n}時間目 ${cellText(x.cell)}`;
        const lp = lastProg(x.cell.subject, x.cell.cls); if(lp) body += lp.next ? ` ・次にやること：${lp.next}` : ` ・前回 ${progLabel(lp)}`; }
      else if(x.type === "extra"){ before = mins(x.start) >= dis && dis ? pref("afterBefore") : pref("classBefore"); title = x.label; }
      else if(x.type === "event"){ const e = S.events.find(y => y.id === x.id) || {}; before = e.remindMin === -1 ? 0 : (e.remindMin || (mins(x.start) >= dis && dis ? pref("afterBefore") : pref("eventBefore"))); title = x.label; if(e.place) body += ` ・${e.place}`; }
      if(!before) return;
      const startAt = atOf(ds, x.start).getTime(), at = startAt - before * 60000;
      out.push({key:`${ds}|${x.type}|${x.start}|${title}`, at, startAt, title, body, lead:`${before}分後に始まります`, go: ds === t ? "today" : null});
    });
  });
  S.tasks.forEach(k => { if(k.remindAt && k.status !== "done"){ const at = new Date(k.remindAt).getTime(); if(!isNaN(at)) out.push({key:`task|${k.id}|${k.remindAt}`, at, title:k.title, body:k.due ? `期限 ${md(k.due)}` : (k.area || ""), lead:"タスクのリマインド", task:k.id}); } });
  return out.filter(r => r.at >= fromMs && r.at <= toMs).sort((a,b) => a.at - b.at);
}
function remindCheck(){
  if(!S.ready) return;
  const now = Date.now(), fired = ls.get("fd-fired", {});
  reminderList(now - 20*60000, now).forEach(r => { if(!fired[r.key] && !(r.startAt && now >= r.startAt)){ fired[r.key] = now; banner(r); } });
  if(pref("morning") && new Date().getHours() >= 5){
    const k = "morning|" + todayS();
    if(!fired[k]){ fired[k] = now; const s = morningLine(); if(s) banner({title:"おはようございます", body:s, lead:"今日のまとめ", go:"today"}); }
  }
  Object.keys(fired).forEach(k => { if(now - fired[k] > 3*864e5) delete fired[k]; });
  ls.set("fd-fired", fired);
}
function morningLine(){
  const t = todayS(), it = (dayItems(t) || []).filter(x => !x.cancelled);
  const cls = it.filter(x => x.type === "period" && cellKind(x.cell) !== "free").length;
  const ch = it.filter(x => x.changed || x.type === "extra").length;
  const due = openTasks().filter(x => x.due && x.due <= t).length;
  const ev = S.events.filter(e => e.date === t).length;
  const parts = [isWeekday(t) ? `${OFFICIAL[dayMode(t)].label}時程・授業${cls}コマ` : "", ch ? `変更${ch}件` : "", ev ? `予定${ev}件` : "", due ? `今日までのタスク${due}件` : ""].filter(Boolean);
  return parts.join(" ・ ");
}
setInterval(() => { if(!document.hidden) remindCheck(); }, 15000);

function banner(r){ bq.push(r); if(!bOn) nextBanner(); }
function nextBanner(){
  const r = bq.shift(), el = $("#banner"); if(!r){ bOn = false; el.classList.remove("on"); return; }
  bOn = true;
  el.innerHTML = `<span class="ic">${ico("bell")}</span><span class="bt"><small>${esc(r.lead || "Fold Desk")}</small><b>${esc(r.title)}</b>${r.body ? `<span>${esc(r.body)}</span>` : ''}</span>
    <span class="bx">${r.task ? `<button class="chip accent" data-banner-task="${esc(r.task)}">開く</button>` : r.go ? `<button class="chip accent" data-banner-go="${r.go}">開く</button>` : ''}<button class="icon-btn sm" data-banner-close aria-label="閉じる">${ico("close")}</button></span>`;
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
  try { concierge.react(r.sad ? "sorry" : "wave"); } catch(e){}
  sysNotify(r);
  try { navigator.vibrate && navigator.vibrate([14, 60, 14]); } catch(e){}
  clearTimeout(bTimer); bTimer = setTimeout(closeBanner, 9000);
}
function closeBanner(){ $("#banner").classList.remove("on"); clearTimeout(bTimer); setTimeout(nextBanner, 450); }

/* ================= phone notifications via Google Calendar ================= */
const FD_TAG = "[FoldDesk]";
function gcalErr(e){
  const c = e && e.code;
  const msg = { not_found:"Googleカレンダーの予定が見つかりませんでした", offline:"オフラインのため登録できませんでした。アプリ内の通知は有効です",
    auth:"接続が切れています。設定から接続し直してください", bad_request:"登録できない内容でした" }[c];
  toast(msg || "スマホ通知の登録に失敗しました。アプリ内の通知は有効です"); try { concierge.react("sorry"); } catch(e){}
}
function pickId(res){
  const p = res && res.payload;
  if(p && typeof p === "object") return p.id || p.eventId || (p.event && p.event.id) || null;
  const txt = typeof p === "string" ? p : ((res && res.content || []).find(c => c.type === "text") || {}).text || "";
  const m = txt.match(/"id"\s*:\s*"([^"]+)"/) || txt.match(/event[ _]?id[^A-Za-z0-9]+([A-Za-z0-9_]{8,})/i);
  return m ? m[1] : null;
}
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
async function gcalDelete(id){ if(!mcp || !id) return; try { await mcp.callTool(GCAL, "delete_event", {eventId:id, notificationLevel:"NONE"}); } catch(e){} }
/* returns the calendar event id to keep on the item ("" when none) */
async function gcalSyncTask(t){
  if(!mcp){ if(t.phone) toast("この画面ではスマホ通知を登録できません。アプリ内の通知は有効です"); return t.gcalId || ""; }
  if(!t.phone || !t.remindAt || t.status === "done"){ if(t.gcalId) await gcalDelete(t.gcalId); return ""; }
  const st = new Date(t.remindAt), en = new Date(st.getTime() + 15*60000);
  const body = {summary:t.title, startTime:iso(st), endTime:iso(en), description:`Fold Desk のリマインド ${FD_TAG}${t.note ? "\n\n" + t.note : ""}`,
    overrideReminders:[{method:"popup", minutes:0}], availability:"AVAILABILITY_FREE", notificationLevel:"NONE"};
  try {
    if(t.gcalId){ await mcp.callTool(GCAL, "update_event", {eventId:t.gcalId, ...body}); toast("スマホにも通知します"); return t.gcalId; }
    const id = pickId(await mcp.callTool(GCAL, "create_event", body)); toast("スマホにも通知します（Googleカレンダー）"); return id || "";
  } catch(e){ gcalErr(e); return t.gcalId || ""; }
}
async function gcalSyncEvent(e){
  const mins0 = e.remindMin > 0 ? e.remindMin : pref("eventBefore") || 10;
  if(!mcp){ if(e.phone) toast("この画面ではスマホ通知を登録できません。アプリ内の通知は有効です"); return e.gcalId || ""; }
  if(e.id && e.id.startsWith("gc-")){ /* already on Google Calendar: just set its reminder */
    if(!e.phone) return "";
    try { await mcp.callTool(GCAL, "update_event", {eventId:e.calId || e.id.slice(3), overrideReminders:[{method:"popup", minutes:mins0}], notificationLevel:"NONE"}); toast(`Googleカレンダーの予定に${mins0}分前の通知を付けました`); } catch(err){ gcalErr(err); }
    return "";
  }
  if(!e.phone){ if(e.gcalId) await gcalDelete(e.gcalId); return ""; }
  if(!e.time){ toast("スマホ通知には開始時刻が必要です"); return e.gcalId || ""; }
  const st = atOf(e.date, e.time), en = atOf(e.date, evEnd(e));
  const body = {summary:e.title, startTime:iso(st), endTime:iso(en), location:e.place || "", description:`Fold Desk から登録 ${FD_TAG}${e.note ? "\n\n" + e.note : ""}`,
    overrideReminders:[{method:"popup", minutes:mins0}], notificationLevel:"NONE"};
  try {
    if(e.gcalId){ await mcp.callTool(GCAL, "update_event", {eventId:e.gcalId, ...body}); toast("スマホにも通知します"); return e.gcalId; }
    const id = pickId(await mcp.callTool(GCAL, "create_event", body)); toast(`${mins0}分前にスマホに通知します（Googleカレンダー）`); return id || "";
  } catch(err){ gcalErr(err); return e.gcalId || ""; }
}

function askSummary(x){
  const tm = x.time ? ` ${x.time}${x.endTime ? "–" + x.endTime : ""}` : "";
  switch(x.type){
    case "task": return ["タスク", x.title, [x.due ? `期限 ${md(x.due)}` : "期限なし", x.area].filter(Boolean).join(" · ")];
    case "event": return ["予定", x.title, `${x.date ? md(x.date) : ""}${tm}${x.place ? " · " + x.place : ""}`];
    case "change": return ["時間割の変更", `${x.date ? md(x.date) : ""} ${x.period}時間目`, x.cancel ? "なしにする" : `${x.subject || ""}${x.cls ? " " + x.cls : ""}`];
    case "extra": return ["差し込み", x.title, `${x.date ? md(x.date) : ""} ${x.period ? x.period + "時間目" : (x.start || "") + (x.end ? "–" + x.end : "")}`];
    case "progress": return ["進度", `${x.subject}${x.cls ? " " + x.cls : ""}`, [progLabel(x), x.next ? "次：" + x.next : "", (x.prep||[]).length ? "準備：" + x.prep.join("、") : ""].filter(Boolean).join(" · ")];
    default: return ["メモ", x.text || "", ""];
  }
}

/* turn the text read from a card into person fields (works without AI) */
function parseCard(r){
  const L = (r.lines || []).map(l => ({t:String(l.t || "").replace(/\s+/g, " ").trim(), h:+l.h || 0})).filter(l => l.t);
  const N = t => t.normalize("NFKC");
  const all = L.map(l => N(l.t)).join("\n");
  const email = (all.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/) || [""])[0];
  const phones = [];
  L.forEach(l => { const t = N(l.t); if(/fax|ファクス|ファックス/i.test(t)) return;
    (t.match(/(\+81[\s-]?)?0\d{1,4}[\s\-‐ー()]{0,2}\d{1,4}[\s\-‐ー()]{0,2}\d{3,4}/g) || []).forEach(x => { const dg = x.replace(/\D/g, "").replace(/^81/, "0");
      if(dg.length >= 10 && dg.length <= 11) phones.push({x:x.trim(), mobile:/^0[789]0/.test(dg), tel:/tel|電話|携帯|mobile|直通/i.test(t)}); }); });
  const phone = ((phones.find(p => p.mobile) || phones.find(p => p.tel) || phones[0]) || {}).x || "";
  const ORG = /(株式会社|有限会社|合同会社|社団法人|財団法人|学校法人|NPO|学園|学校|小学校|中学校|高等学校|高校|大学|研究所|協会|委員会|センター|事務所|役所|役場|Inc\.?|Co\.,?\s?Ltd|Corporation|Corp\.?|LLC|㈱|\(株\))/i;
  const ROLE = /(代表|取締役|社長|会長|部長|課長|係長|主任|主幹|主事|教諭|校長|教頭|園長|理事|室長|所長|センター長|マネージャー|マネジャー|リーダー|ディレクター|エンジニア|コンサルタント|担当|スペシャリスト|講師|教授|准教授|助教|研究員|営業|Manager|Director|Engineer|CEO|CTO|COO|President|Officer|Lead|Specialist)/i;
  const contact = t => /@|https?:|www\.|tel|fax|電話|携帯|mobile|e-?mail|メール|〒/i.test(t) || /\d{2,4}[-‐]\d{2,4}[-‐]\d{3,4}/.test(N(t));
  const org = (L.find(l => ORG.test(l.t) && !contact(l.t) && l.t.length <= 40) || {}).t || "";
  const role = (L.find(l => ROLE.test(l.t) && !contact(l.t) && l.t !== org && l.t.length <= 30) || {}).t || "";
  const cjk = /[㐀-鿿々]/;
  const cand = L.filter(l => !contact(l.t) && l.t !== org && !ORG.test(l.t) && !/\d/.test(l.t) && cjk.test(l.t))
    .map(l => ({...l, core:l.t.replace(ROLE, "").replace(/[\s・　]+/g, " ").trim()}))
    .filter(l => { const n = l.core.replace(/\s/g, ""); return n.length >= 2 && n.length <= 10; })
    .sort((a, b) => b.h - a.h);
  const name = cand.length ? cand[0].core : "";
  const kana = (L.find(l => /^[぀-ゟ゠-ヿー\s・]{3,24}$/.test(l.t) && !ROLE.test(l.t)) || {}).t || "";
  const note = L.filter(l => /〒|都|道|府|県/.test(l.t) && /\d|丁目|番地|市|区|町/.test(l.t) && !contact(l.t.replace("〒", "")) || /〒/.test(l.t) || /https?:|www\./i.test(l.t)).map(l => l.t).join("\n");
  return {name, kana, org, role, email, phone, about:"", note};
}
