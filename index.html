      const s = ds[di], base = (G.grid[dk]||[])[pi] || {}, o = ((getOv(s)||{}).cells||{})[pi];
      const c = o && !o.cancel ? o : base, cancelled = !!(o && o.cancel);
      const k = cancelled ? "free" : cellKind(c), isToday = s === t;
      const isNow = isToday && st.cur && st.cur.type === "period" && st.cur.n === pi+1;
      const off = cancelled || !OFFICIAL[dayMode(s)][bandOf(c)][pi];
      return `<td><button class="cell ${k} ${isToday?'todaycol':''} ${isNow?'now':''} ${off?'off':''} ${o?'changed':''}" data-tcell="${s}:${pi}:${dk}" aria-label="${md(s)} ${pi+1}時間目 ${esc(cancelled ? 'なし' : cellText(c))}">
        <b>${cancelled ? 'なし' : (k==='free' ? '' : esc(c.subject))}</b>${!cancelled && c.cls ? `<small>${esc(c.cls)}</small>` : ''}</button></td>`; }).join("")}</tr>`).join("");
  const counts = {joho:0, class:0, meeting:0, free:0};
  DAYKEYS.forEach(dk => (G.grid[dk]||[]).forEach(c => counts[cellKind(c)]++));

    ${DAYKEYS.every(dk => !(G.grid[dk] || []).some(c => c && c.subject)) ? `<div class="card tip" style="margin-bottom:14px"><span class="ic">${ico("tt")}</span><span class="main"><b>時間割を登録しましょう</b><small>手で入れるか、Excel・スプレッドシートの表（CSV）から読み込めます</small></span><button class="pill-btn accent" data-tt-open>登録</button></div>` : ""}

/* ================= TASKS ================= */
function vTasks(){
  const t = todayS(), f = ui.taskFilter;
  let list = S.tasks.slice();
  if(f === "open") list = openTasks();
  else if(f === "today") list = openTasks().filter(x => x.due && x.due <= t);
  else if(f === "week") list = openTasks().filter(x => x.due && x.due <= addDays(t,7));
  else if(f === "done") list = S.tasks.filter(x => x.status === "done").sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const areas = [...new Set(S.tasks.map(x => x.area).filter(Boolean))];
  const groups = f === "done" ? [["完了", list]] : areas.length > 1 && document.body.dataset.mode !== "cover-p"
    ? [...areas.map(a => [a, list.filter(x => x.area === a)]), ["その他", list.filter(x => !x.area)]].filter(g => g[1].length)
    : [["", list]];
  const chips = [["open","未完了"],["today","今日まで"],["week","1週間"],["done","完了"]].map(([k,l]) => `<button class="chip" data-tf="${k}" aria-pressed="${f===k}">${l}</button>`).join("");
  const body = list.length ? (groups.length > 1 ? `<div class="grid two">${groups.map(([g, xs]) => `<div class="card"><h3>${esc(g)}<span class="more" style="color:var(--muted)">${xs.length}</span></h3>${xs.map(taskRow).join("")}</div>`).join("")}</div>`
      : `<div class="card">${list.map(taskRow).join("")}</div>`)
    : !S.tasks.length ? emptyBig("tasks", "タスクはまだありません", "期限を入れておくと、「今日」とウィジェットで近いものから知らせます。", `<button class="btn primary" data-new="task">${ico("plus")} タスクを追加</button>`)
    : `<div class="card"><p class="empty">${f==='done'?'完了したタスクはまだありません。':'該当するタスクはありません。'}</p></div>`;
  const fc = f !== "done" ? followCard() : "";
  return `<div class="page-h"><h1>タスク</h1><button class="pill-btn accent" data-new="task">${ico("plus")}新規</button></div>
    <div class="toolbar">${chips}</div>${fc ? `<div style="margin-bottom:14px">${fc}</div>` : ''}${body}`;
}

/* ================= EVENTS ================= */

async function shareAct(k){
  if(k === "photos" && shared && NATIVE){ const files = (shared.files || []).filter(f => /^image\//.test(f.mime)).map(f => { const b64 = NATIVE.shareFile(f.id); if(!b64) return null;
      return new File([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], f.name || "photo.jpg", {type:f.mime || "image/jpeg"}); }).filter(Boolean);
    try { NATIVE.shareDone(); } catch(e){} shared = null; closePane(); ui.docTab = "photos"; ls.set("fd-doctab", "photos"); go("docs"); if(files.length) await savePhotos(files, "auto", true); else toast("写真を受け取れませんでした"); return; }
  const sh = shared; if(!sh) return;
  const text = [sh.subject, sh.text].filter(Boolean).join("\n").trim();
  const title = (sh.subject || text.split("\n").find(x => x.trim()) || "").replace(/https?:\/\/\S+/g, "").trim().slice(0, 80);
  const imgs = (sh.files || []).filter(f => /^image\//.test(f.mime));
  if(k === "card" && imgs.length){ NATIVE.scanShared(imgs[0].id); shared = null; return; }
  try { NATIVE.shareDone(); } catch(e){}
  shared = null;
  if(k === "ask"){ askPane(); setTimeout(() => { const t = $("#pane textarea[name=text]"); if(t){ t.value = text.slice(0, 2000); t.focus(); } }, 80); }
  else if(k === "task") taskForm({title:title || text.slice(0, 60), note:text.slice(0, 2000)});
  else if(k === "event") eventForm({title:title || text.slice(0, 60), note:text.slice(0, 2000)});
  else if(k === "memo"){ await put("memos", null, {text:text.slice(0, 4000), done:false, createdAt:new Date().toISOString()}); closePane(); toast("メモに保存しました"); concierge.say("メモしておいたよ！", "joy", 2200); }
}

/* ================= reminders (in-app) ================= */
const atOf = (dateS, hm) => { const d = parse(dateS); const [h, m] = hm.split(":").map(Number); d.setHours(h, m, 0, 0); return d; };
function reminderList(fromMs, toMs){
  const out = [], t = todayS();
  [t, addDays(t, 1)].forEach(ds => {
    const items = (dayItems(ds) || []).filter(x => !x.cancelled), M = OFFICIAL[dayMode(ds)], dis = isWeekday(ds) ? mins(M.dismiss) : 0;
    items.forEach(x => {
      let before = null, title = "", body = `${x.start}〜${x.end}`;
      if(x.type === "period"){ if(cellKind(x.cell) === "free") return; before = pref("classBefore"); title = `${x.n}時間目 ${cellText(x.cell)}`;
        const lp = lastProg(x.cell.subject, x.cell.cls); if(lp) body += lp.next ? ` ・次にやること：${lp.next}` : ` ・前回 ${progLabel(lp)}`; }
      else if(x.type === "extra"){ before = mins(x.start) >= dis && dis ? pref("afterBefore") : pref("classBefore"); title = x.label; }
      else if(x.type === "event"){ const e = S.events.find(y => y.id === x.id) || {}; before = e.remindMin === -1 ? 0 : (e.remindMin || (mins(x.start) >= dis && dis ? pref("afterBefore") : pref("eventBefore"))); title = x.label; if(e.place) body += ` ・${e.place}`; }
      if(!before) return;
      const startAt = atOf(ds, x.start).getTime(), at = startAt - before * 60000;
      out.push({key:`${ds}|${x.type}|${x.start}|${title}`, at, startAt, title, body, lead:`${before}分後に始まります`, go: ds === t ? "today" : null});
    });
  });
  S.tasks.forEach(k => { if(k.remindAt && k.status !== "done"){ const at = new Date(k.remindAt).getTime(); if(!isNaN(at)) out.push({key:`task|${k.id}|${k.remindAt}`, at, title:k.title, body:k.due ? `期限 ${md(k.due)}` : (k.area || ""), lead:"タスクのリマインド", task:k.id}); } });
  return out.filter(r => r.at >= fromMs && r.at <= toMs).sort((a,b) => a.at - b.at);
}
function remindCheck(){
  if(!S.ready) return;
  const now = Date.now(), fired = ls.get("fd-fired", {});
  reminderList(now - 20*60000, now).forEach(r => { if(!fired[r.key] && !(r.startAt && now >= r.startAt)){ fired[r.key] = now; banner(r); } });
  if(pref("morning") && new Date().getHours() >= 5){
    const k = "morning|" + todayS();
    if(!fired[k]){ fired[k] = now; const s = morningLine(); if(s) banner({title:"おはようございます", body:s, lead:"今日のまとめ", go:"today"}); }
  }
  Object.keys(fired).forEach(k => { if(now - fired[k] > 3*864e5) delete fired[k]; });
  ls.set("fd-fired", fired);
}
function morningLine(){
  const t = todayS(), it = (dayItems(t) || []).filter(x => !x.cancelled);
  const cls = it.filter(x => x.type === "period" && cellKind(x.cell) !== "free").length;
  const ch = it.filter(x => x.changed || x.type === "extra").length;
  const due = openTasks().filter(x => x.due && x.due <= t).length;
  const ev = S.events.filter(e => e.date === t).length;
  const parts = [isWeekday(t) ? `${OFFICIAL[dayMode(t)].label}時程・授業${cls}コマ` : "", ch ? `変更${ch}件` : "", ev ? `予定${ev}件` : "", due ? `今日までのタスク${due}件` : ""].filter(Boolean);
  return parts.join("　");
}
setInterval(() => { if(!document.hidden) remindCheck(); }, 15000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ remindCheck(); schedule(); } });

const bq = []; let bOn = false, bTimer = 0;
function banner(r){ bq.push(r); if(!bOn) nextBanner(); }
function nextBanner(){
  const r = bq.shift(), el = $("#banner"); if(!r){ bOn = false; el.classList.remove("on"); return; }
  bOn = true;
  el.innerHTML = `<span class="ic">${ico("bell")}</span><span class="bt"><small>${esc(r.lead || "Fold Desk")}</small><b>${esc(r.title)}</b>${r.body ? `<span>${esc(r.body)}</span>` : ''}</span>

/* ================= phone notifications via Google Calendar ================= */
const FD_TAG = "[FoldDesk]";
function gcalErr(e){
  const c = e && e.code;
  const msg = { not_found:"Googleカレンダーの予定が見つかりませんでした", offline:"オフラインのため登録できませんでした。アプリ内の通知は有効です",
    auth:"接続が切れています。設定から接続し直してください", bad_request:"登録できない内容でした" }[c];
  toast(msg || "スマホ通知の登録に失敗しました。アプリ内の通知は有効です"); try { concierge.react("sorry"); } catch(e){}
}
function pickId(res){
  const p = res && res.payload;
  if(p && typeof p === "object") return p.id || p.eventId || (p.event && p.event.id) || null;
  const txt = typeof p === "string" ? p : ((res && res.content || []).find(c => c.type === "text") || {}).text || "";
  const m = txt.match(/"id"\s*:\s*"([^"]+)"/) || txt.match(/event[ _]?id[^A-Za-z0-9]+([A-Za-z0-9_]{8,})/i);
  return m ? m[1] : null;
}
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
async function gcalDelete(id){ if(!mcp || !id) return; try { await mcp.callTool(GCAL, "delete_event", {eventId:id, notificationLevel:"NONE"}); } catch(e){} }
/* returns the calendar event id to keep on the item ("" when none) */
async function gcalSyncTask(t){
  if(!mcp){ if(t.phone) toast("この画面ではスマホ通知を登録できません。アプリ内の通知は有効です"); return t.gcalId || ""; }
  if(!t.phone || !t.remindAt || t.status === "done"){ if(t.gcalId) await gcalDelete(t.gcalId); return ""; }
  const st = new Date(t.remindAt), en = new Date(st.getTime() + 15*60000);
  const body = {summary:t.title, startTime:iso(st), endTime:iso(en), description:`Fold Desk のリマインド ${FD_TAG}${t.note ? "\n\n" + t.note : ""}`,
    overrideReminders:[{method:"popup", minutes:0}], availability:"AVAILABILITY_FREE", notificationLevel:"NONE"};
  try {
    if(t.gcalId){ await mcp.callTool(GCAL, "update_event", {eventId:t.gcalId, ...body}); toast("スマホにも通知します"); return t.gcalId; }
    const id = pickId(await mcp.callTool(GCAL, "create_event", body)); toast("スマホにも通知します（Googleカレンダー）"); return id || "";
  } catch(e){ gcalErr(e); return t.gcalId || ""; }
}
async function gcalSyncEvent(e){
  const mins0 = e.remindMin > 0 ? e.remindMin : pref("eventBefore") || 10;
  if(!mcp){ if(e.phone) toast("この画面ではスマホ通知を登録できません。アプリ内の通知は有効です"); return e.gcalId || ""; }
  if(e.id && e.id.startsWith("gc-")){ /* already on Google Calendar: just set its reminder */
    if(!e.phone) return "";
    try { await mcp.callTool(GCAL, "update_event", {eventId:e.calId || e.id.slice(3), overrideReminders:[{method:"popup", minutes:mins0}], notificationLevel:"NONE"}); toast(`Googleカレンダーの予定に${mins0}分前の通知を付けました`); } catch(err){ gcalErr(err); }
    return "";
  }
  if(!e.phone){ if(e.gcalId) await gcalDelete(e.gcalId); return ""; }
  if(!e.time){ toast("スマホ通知には開始時刻が必要です"); return e.gcalId || ""; }
  const st = atOf(e.date, e.time), en = atOf(e.date, evEnd(e));
  const body = {summary:e.title, startTime:iso(st), endTime:iso(en), location:e.place || "", description:`Fold Desk から登録 ${FD_TAG}${e.note ? "\n\n" + e.note : ""}`,
    overrideReminders:[{method:"popup", minutes:mins0}], notificationLevel:"NONE"};
  try {
    if(e.gcalId){ await mcp.callTool(GCAL, "update_event", {eventId:e.gcalId, ...body}); toast("スマホにも通知します"); return e.gcalId; }
    const id = pickId(await mcp.callTool(GCAL, "create_event", body)); toast(`${mins0}分前にスマホに通知します（Googleカレンダー）`); return id || "";
  } catch(err){ gcalErr(err); return e.gcalId || ""; }
}

function askSummary(x){
  const tm = x.time ? ` ${x.time}${x.endTime ? "–" + x.endTime : ""}` : "";
  switch(x.type){
    case "task": return ["タスク", x.title, [x.due ? `期限 ${md(x.due)}` : "期限なし", x.area].filter(Boolean).join("　")];
    case "event": return ["予定", x.title, `${x.date ? md(x.date) : ""}${tm}${x.place ? "　" + x.place : ""}`];
    case "change": return ["時間割の変更", `${x.date ? md(x.date) : ""} ${x.period}時間目`, x.cancel ? "なしにする" : `${x.subject || ""}${x.cls ? " " + x.cls : ""}`];
    case "extra": return ["差し込み", x.title, `${x.date ? md(x.date) : ""} ${x.period ? x.period + "時間目" : (x.start || "") + (x.end ? "–" + x.end : "")}`];
    case "progress": return ["進度", `${x.subject}${x.cls ? " " + x.cls : ""}`, [progLabel(x), x.next ? "次：" + x.next : "", (x.prep||[]).length ? "準備：" + x.prep.join("、") : ""].filter(Boolean).join("　")];
    default: return ["メモ", x.text || "", ""];
  }
}

async function saveAsk(){
  let n = 0;
  for(const x of askItems.filter(y => y._on)){
    const date = x.date || todayS();
    if(x.type === "task") await put("tasks", null, {title:x.title||"", due:x.due||"", priority:x.priority||"mid", area:x.area||"", status:"todo", note:x.note||"", personIds:[], createdAt:new Date().toISOString()});
    else if(x.type === "event") await put("events", null, {title:x.title||"", date, time:x.time||"", endTime:x.endTime||"", kind:x.kind||"", place:x.place||"", note:x.note||""});
    else if(x.type === "change" && +x.period >= 1 && +x.period <= NP()){ const ov = cloneOv(date); ov.cells[+x.period - 1] = x.cancel ? {cancel:true, note:x.note||""} : {subject:x.subject||"", cls:x.cls||"", kind:"class", note:x.note||""}; await saveOv(date, ov); }
    else if(x.type === "extra"){ if(!x.period && !x.start) x.start = "16:10"; const ov = cloneOv(date); ov.extra.push({title:x.title||"", kind:x.kind||"会議", period:x.period ? +x.period : null, start:x.start||"", end:x.end||"", note:x.note||""}); await saveOv(date, ov); }
    else if(x.type === "progress" && x.subject) await put("progress", null, {subject:x.subject, cls:x.cls||"", unit:x.unit||"", lesson:x.lesson ? +x.lesson : null, page:String(x.page||""), done:x.done||"", next:x.next||"", prep:x.prep||[], prepDone:[], date});
    else await put("memos", null, {text:x.text || x.title || "", done:false, createdAt:new Date().toISOString()});
    n++;
  }
  closePane(); toast(`${n}件 入れました`); concierge.say(n ? "入れておきました！" : "わかりました", "joy", 2400);
}

/* turn the text read from a card into person fields (works without AI) */
function parseCard(r){
  const L = (r.lines || []).map(l => ({t:String(l.t || "").replace(/\s+/g, " ").trim(), h:+l.h || 0})).filter(l => l.t);
  const N = t => t.normalize("NFKC");
  const all = L.map(l => N(l.t)).join("\n");
  const email = (all.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/) || [""])[0];
  const phones = [];
  L.forEach(l => { const t = N(l.t); if(/fax|ファクス|ファックス/i.test(t)) return;
    (t.match(/(\+81[\s-]?)?0\d{1,4}[\s\-‐ー()]{0,2}\d{1,4}[\s\-‐ー()]{0,2}\d{3,4}/g) || []).forEach(x => { const dg = x.replace(/\D/g, "").replace(/^81/, "0");
      if(dg.length >= 10 && dg.length <= 11) phones.push({x:x.trim(), mobile:/^0[789]0/.test(dg), tel:/tel|電話|携帯|mobile|直通/i.test(t)}); }); });

function parseCSV(text){
  text = String(text || "").replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const first = text.split("\n").find(l => l.trim()) || "";
  const dl = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch === '"' && cell === "") q = true;
    else if(ch === dl){ row.push(cell); cell = ""; }
    else if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(c => String(c).trim())).filter(r => r.some(Boolean));
}

async function call(body, timeoutMs = 30000){

const store = (() => {
  const KEY = "fd-store-v1", QKEY = "fd-queue-v1";
  let st = ls.get(KEY, {cols:{}, cfg:{}, rev:0}), queue = ls.get(QKEY, []), flushing = false, pulling = false;
  const subs = {};
  const snapOf = c => ({docs:Object.entries(st.cols[c] || {}).map(([id, d]) => ({id, data:() => d}))});
  const cfgSnap = k => ({exists:st.cfg[k] !== undefined && st.cfg[k] !== null, data:() => st.cfg[k]});
  const emitCol = c => (subs["c:" + c] || []).forEach(fn => fn(snapOf(c)));
  const emitCfg = k => (subs["d:" + k] || []).forEach(fn => fn(cfgSnap(k)));
  const emitAll = () => { Object.keys(subs).forEach(k => k[0] === "c" ? emitCol(k.slice(2)) : emitCfg(k.slice(2))); };
  function apply(op){
    if(op.op === "put"){ (st.cols[op.col] = st.cols[op.col] || {})[op.id] = op.doc; }
    else if(op.op === "del"){ if(st.cols[op.col]) delete st.cols[op.col][op.id]; }
    else if(op.op === "cfg"){ st.cfg[op.key] = op.value; }
  }
  const persist = () => { ls.set(KEY, st); ls.set(QKEY, queue); };
  function local(op){ apply(op); queue.push(op); persist(); op.op === "cfg" ? emitCfg(op.key) : emitCol(op.col); flush(); }
  async function flush(){
    if(flushing || !queue.length || !paired()) return;
    flushing = true;
    try {
      while(queue.length){ const batch = queue.slice(0, 40); const j = await call({op:"batch", ops:batch}); queue.splice(0, batch.length); st.rev = j.rev; persist(); }
      setSync("ok");
    } catch(e){ if(e.code !== "auth" && e.code !== "locked") setSync("offline"); setTimeout(flush, 20000); }
    finally { flushing = false; }
  }
  async function pull(force){
    if(pulling || !paired()) return; pulling = true;
    try {
      if(queue.length) await flush();
      const j = await call({op: force === "sync" ? "sync" : "pull", rev: force ? 0 : st.rev});
      if(j.changed){ st.cols = j.data.cols || {}; st.cfg = j.data.cfg || {}; st.rev = j.rev; queue.forEach(apply); persist(); emitAll(); }
      setSync("ok");
    } catch(e){ if(e.code !== "auth" && e.code !== "locked") setSync("offline"); }
    finally { pulling = false; }
  }
  function wipe(){ st = {cols:{}, cfg:{}, rev:0}; queue = []; persist(); emitAll(); }
  /* another copy of the app (the widget helper) may have changed the shared storage */
  function reload(){ const a = ls.get(KEY, null); if(!a) return; st = a; queue = ls.get(QKEY, []); emitAll(); flush(); }
  return {
    collection(c){ return { doc(id){ return { set: async body => local({op:"put", col:c, id, doc:body}), delete: async () => local({op:"del", col:c, id}) }; },
      onSnapshot(fn){ (subs["c:" + c] = subs["c:" + c] || []).push(fn); fn(snapOf(c)); } }; },
    doc(path){ const k = path.split("/")[1]; return { set: async v => local({op:"cfg", key:k, value:v}), onSnapshot(fn){ (subs["d:" + k] = subs["d:" + k] || []).push(fn); fn(cfgSnap(k)); } }; },
    pull, flush, wipe, reload, get pending(){ return queue.length; },
    async idle(){ for(let i = 0; i < 150 && pulling; i++) await new Promise(r => setTimeout(r, 200)); }
  };
})();

async function toJpegB64(file){
  const img = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .85).split(",")[1];
}

async function loadConciergeArt(){
  const spr = document.querySelector("#cc .spr"); if(!spr) return;
  const KEYURL = "/__private/concierge-v1";
  try {
    const cache = await caches.open("fd-private");
    let res = await cache.match(KEYURL);
    if(!res && paired()){
      const j = await call({op:"asset", name:"concierge"}, 60000);
      const bin = Uint8Array.from(atob(j.b64), ch => ch.charCodeAt(0));
      res = new Response(new Blob([bin], {type:j.mime || "image/webp"}));
      await cache.put(KEYURL, res.clone());
    }
    if(res){ const blob = await res.blob(); spr.style.backgroundImage = `url(${URL.createObjectURL(blob)})`; document.getElementById("cc").classList.add("art");
      try { const bm = await createImageBitmap(blob); concierge.setRows(Math.round(bm.height / (bm.width / 8 * 208 / 192))); concierge.setArt(bm); } catch(e){}
      try { if(window.FoldDeskNative && window.FoldDeskNative.isApp() && window.FoldDeskNative.artVersion && window.FoldDeskNative.artVersion() !== blob.size){
        const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
        window.FoldDeskNative.setConciergeArt(b64); } } catch(e){} }
  } catch(e){}
}

/* events with the same name on the same day (personal calendar, school calendar, from mail, typed in the app) are shown once.
   Nothing is deleted or copied: the hidden ones are listed in evDups under the one that is shown. */
let evDups = {};
const evKey = t => String(t || "").normalize("NFKC").toLowerCase().replace(/【[^】]*】|\[[^\]]*\]/g, "").replace(/[\s・･、。,.\-ー―〜~()（）\[\]【】「」『』:：]/g, "");
function mergeEvents(){
  const all = personalEvents.concat(schoolEvents(), devEv);
  evDups = {};
  if(S.prefs && S.prefs.mergeEvents === false){ S.events = all; return; }
  const rank = e => (e.school ? 0 : e.calId ? 30 : 20) + (e.time ? 2 : 0) + (e.place ? 1 : 0);
  const groups = new Map(), out = [];
  for(const e of all){
    const k = evKey(e.title); if(!k || !e.date){ out.push(e); continue; }
    const key = e.date + "|" + k, g = groups.get(key) || [];
    const hit = g.find(x => !x.time || !e.time || x.time === e.time);
    if(hit){ hit.m.push(e); if(!hit.time) hit.time = e.time; } else { g.push({time:e.time, m:[e]}); groups.set(key, g); }
  }
  groups.forEach(g => g.forEach(n => { n.m.sort((a, b) => rank(b) - rank(a)); out.push(n.m[0]); if(n.m.length > 1) evDups[n.m[0].id] = n.m.slice(1); }));
  S.events = out;
}

db.doc("config/prefs").onSnapshot(s => { S.prefs = s.exists ? s.data() : {}; mergeEvents(); schedule(); });
db.doc("config/school").onSnapshot(s => { applySchool(s.exists ? s.data() : null); schedule(); });
db.doc("config/google").onSnapshot(s => { S.google = s.exists ? s.data() : {}; });
S.ready = true; schedule();
refreshSchool(schoolJustPaired);
refreshDevice();
setInterval(() => { if(!document.hidden) refreshDevice(); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshDevice(); });
setInterval(() => { if(!document.hidden) refreshSchool(); }, 5 * 60e3);
if(schoolJustPaired) setTimeout(() => toast("学校のアカウントを接続しました"), 600);
if(schoolPairError) setTimeout(() => toast("学校の接続リンクを読み取れませんでした"), 600);
if(paired()){
  store.pull().then(() => { setTimeout(remindCheck, 1200); loadConciergeArt(); });
  setInterval(() => { if(!document.hidden) store.pull(); }, 45000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden){ store.reload(); store.pull(); refreshSchool(); } });
  window.__fdResume = () => { store.reload(); store.pull(); refreshSchool(); refreshDevice(); };
  addEventListener("online", () => store.pull());
}
if(["#ask","#prep","#settings","#follow","#share","#pomo","#cd"].includes(location.hash) || location.hash.indexOf("#doc=") === 0) setTimeout(() => openRoute(location.hash), 500);
async function widgetAct(a){
  if(a.a === "task"){ const t = S.tasks.find(x => x.id === a.id); if(t && t.status !== "done"){ if(t.gcalId) await gcalDelete(t.gcalId); await put("tasks", t.id, {...t, status:"done", gcalId:""}); } }
  else if(a.a === "follow"){ const f = S.followups.find(x => x.id === a.id); if(f && f.status !== "done") await put("followups", f.id, {...f, status:"done"}); }
  else if(a.a === "prep"){ const [pid, i] = String(a.key || "").split(":"), p = S.progress.find(x => x.id === pid);
    if(p && !(p.prepDone || []).includes(+i)) await put("progress", pid, {...p, prepDone:[...(p.prepDone || []), +i]}); }
  else if(a.a === "mode" && DAY_MODES.includes(a.mode) && /^\d{4}-\d{2}-\d{2}$/.test(a.date || "")){ if(dayMode(a.date) !== a.mode) await setDayMode(a.mode, a.date); }
}
if(NATIVE && location.hash === "#act"){
  (async () => {
    try { if(paired()){ await store.idle(); await store.pull(); await store.idle(); } } catch(e){}
    let acts = []; try { acts = JSON.parse(NATIVE.takeActions() || "[]"); } catch(e){}
    for(const a of acts){ try { await widgetAct(a); } catch(e){} }
    const t0 = Date.now(); store.flush();
    while(store.pending && paired() && Date.now() - t0 < 25000) await new Promise(r => setTimeout(r, 400));
    pushSnapshot(true); try { NATIVE.done(); } catch(e){}
  })();
}
if(NATIVE && location.hash === "#snapshot"){
  const finish = () => { pushSnapshot(true); try { NATIVE.done(); } catch(e){} };
  if(paired()) Promise.all([store.pull(), fetchWeather(true)]).then(finish, finish); else finish();
}
document.addEventListener("visibilitychange", () => { if(document.hidden) pushSnapshot(true); });
function openRoute(h){
  if(h.indexOf("#doc=") === 0){ const id = decodeURIComponent(h.slice(5)); history.replaceState(null, "", location.pathname + "#docs"); go("docs");
    let n = 0; const tryOpen = () => { if(docsList && docsList.some(d => d.id === id)) openDoc(id); else if(docsList && n > 3) toast("資料が見つかりませんでした"); else if(n++ < 30) setTimeout(tryOpen, 150); }; tryOpen(); return; }
  if(h === "#ask") askPane();
  else if(h === "#prep"){ go("today"); setTimeout(() => prepPane(prepTarget()), 300); }
  else if(h === "#settings"){ go("today"); setTimeout(() => settingsPane(), 300); }
  else if(h === "#follow"){ go("tasks"); }
  else if(h === "#pomo"){ timerTab("pomo"); }
  else if(h === "#cd"){ timerTab("cd"); }
  else if(h === "#share"){ history.replaceState(null, "", location.pathname + "#" + (view || "today")); handleShare(); }
}
addEventListener("hashchange", () => {
  if(location.hash.indexOf("#school=") === 0){ readPairing(); if(schoolJustPaired){ schoolJustPaired = false; toast("学校のアカウントを接続しました"); refreshSchool(true); } schoolHandoffPane(); return; }
  if(location.hash.indexOf("#pair=") === 0 && readPairing()) location.reload(); openRoute(location.hash); });
/* the link mailed by the school script opens in the browser; hand it to the Android app, which keeps its own storage */
function schoolHandoffPane(){
  if(NATIVE || !isAndroid || !schoolHandoff) return;
  const link = `intent://pair?s=${schoolHandoff}#Intent;scheme=folddesk;package=io.github.carnoeng.folddesk;end`; schoolHandoff = "";
  openPane(`${paneHead("学校のアカウント")}<p class="empty" style="margin-top:0">Android アプリの Fold Desk を使っている場合は、下のボタンでアプリにも接続してください。</p>
    <div class="btns"><a class="btn primary" href="${esc(link)}">アプリで接続する</a><button class="btn" data-act="close">このままでよい</button></div>`);
}
setTimeout(schoolHandoffPane, 900);
if(location.port === "8765") window.__fdT = {get S(){ return S; }, get evDups(){ return evDups; }, concierge, dayMode, eventForm, closePane, wxfx, wxmini, pomo, cdown, swatch, storagePane, glanceCalc, get pdfv(){ return pdfv; }, openDoc, savePhotos, get photoList(){ return photoList; }, autoSlot, get phv(){ return phv; }};
})();
</script>
